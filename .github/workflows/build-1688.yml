name: Build Ali1688Tool EXE

# 独立 workflow：只有 1688 工具自身的文件变化才触发打包，
# 不再和风鸟工具捆在同一次运行里（原 build-windows.yml 双 job 的问题）。
on:
  push:
    branches: [ main ]
    paths:
      - 'ali1688_build/**'
  workflow_dispatch:  # 允许在 Actions 页面手动只打包这个工具

jobs:
  build:
    runs-on: windows-latest
    # 同一工具的新提交自动取消仍在排队的旧构建，避免排队干等
    concurrency:
      group: build-1688-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 selenium openpyxl pyinstaller requests -i https://pypi.tuna.tsinghua.edu.cn/simple

    - name: Download chromedrivers (Stable + 2 previous majors, win64)
      # 版本挑选与解包全部交给 .github/scripts/fetch_chromedrivers.py：pwsh 对
      # PSCustomObject 做减法和数组索引语义不稳（op_Subtraction on Object[] 已实测挂过），
      # 脚本内已带「不足 2 个驱动就中止」的判据。
      run: python .github/scripts/fetch_chromedrivers.py

    - name: Build EXE with PyInstaller
      run: |
        cd ali1688_build
        python -m PyInstaller --noconfirm --onefile --windowed --name Ali1688Tool --add-data "drivers;drivers" --collect-all selenium --collect-all PyQt5 --hidden-import requests --hidden-import customer_library_cleaner --hidden-import yzd_client --hidden-import task_registry ali1688_gui.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ali1688Tool
        path: |
          ali1688_build/dist/Ali1688Tool.exe
