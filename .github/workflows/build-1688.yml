name: Build Ali1688Tool EXE

# 独立 workflow：只有 1688 工具自身的文件变化才触发打包，
# 不再和风鸟工具捆在同一次运行里（原 build-windows.yml 双 job 的问题）。
on:
  push:
    branches: [ main ]
    paths:
      - 'ali1688_build/**'
  workflow_dispatch:  # 允许在 Actions 页面手动只打包这个工具

jobs:
  build:
    runs-on: windows-latest
    # 同一工具的新提交自动取消仍在排队的旧构建，避免排队干等
    concurrency:
      group: build-1688-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 selenium openpyxl pyinstaller requests -i https://pypi.tuna.tsinghua.edu.cn/simple

    - name: Download chromedrivers (top 3 majors, win64)
      run: |
        $ErrorActionPreference = 'Stop'   # 不设为 Stop 时 try/catch 接不住网络失败，重试形同虚设
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          try {
            $j = Invoke-RestMethod 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
            $k = Invoke-RestMethod 'https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json'
            Write-Host "stable version: $($j.channels.Stable.version)"
            # 取 known-good-versions 里最大的 3 个大版本（各挑最新一个具体版本）。
            # 不能用 Stable 主版本号减 1/减 2 去凑：驱动发布节奏不一致时对应版本取空，
            # $v.downloads 立刻报错，整个 job 两秒就挂。
            $majors = @($k.versions | ForEach-Object { [int]($_.version.Split('.')[0]) } |
              Sort-Object -Descending -Unique | Select-Object -First 3)
            Write-Host "bundling majors: $($majors -join ', ')"
            New-Item -ItemType Directory -Force ali1688_build/drivers | Out-Null
            foreach ($mj in $majors) {
              $v = @($k.versions | Where-Object { [int]($_.version.Split('.')[0]) -eq $mj })[-1]
              $u = ($v.downloads.chromedriver | Where-Object { $_.platform -eq 'win64' }).url
              Invoke-WebRequest $u -OutFile cd.zip
              if (Test-Path cd_tmp) { Remove-Item cd_tmp -Recurse -Force }
              Expand-Archive cd.zip -DestinationPath cd_tmp
              Copy-Item cd_tmp/chromedriver-win64/chromedriver.exe ali1688_build/drivers/chromedriver.$mj.exe -Force
              Write-Host "bundled chromedriver.$mj ($($v.version))"
            }
            Remove-Item cd.zip,cd_tmp -Recurse -Force
            exit 0
          } catch {
            Write-Host "第 $attempt 次下载失败: $_"
            Start-Sleep -Seconds 10
          }
        }
        Write-Error "chromedriver 下载连续 3 次失败"
        exit 1

    - name: Build EXE with PyInstaller
      run: |
        cd ali1688_build
        python -m PyInstaller --noconfirm --onefile --windowed --name Ali1688Tool --add-data "drivers;drivers" --collect-all selenium --collect-all PyQt5 --hidden-import requests --hidden-import customer_library_cleaner --hidden-import yzd_client --hidden-import task_registry ali1688_gui.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ali1688Tool
        path: |
          ali1688_build/dist/Ali1688Tool.exe
