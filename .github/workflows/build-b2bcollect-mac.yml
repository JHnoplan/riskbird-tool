name: Build B2bCollectTool Mac App

# b2bcollect 工具的 macOS 云端打包（与 build-b2bcollect.yml 的 Windows 打包互相独立）。
# macos-14 是 Apple Silicon（arm64）runner：本仓库开发机是 Intel，打不出 M 芯片原生机，
# 必须借云端 arm64 环境。PyQt5 5.15.11+/lxml 均有 arm64 wheel，selenium 纯 Python，可直接装。
#
# 随包凭证（与 Windows 版 build-b2bcollect.yml 完全同口径，2026-11 外部机器全员
# 丐版的直接根因）：config.json 在 .gitignore 里，仓库里永远没有它，打包机上也没有
# 开发机那份 iOS 工程常量文件 —— 于是发出去的每个 .app 都读不到权限服务凭证，
# 外部机器一律被判精简版。现在构建前用 Actions Secrets 现写 config.json 随包分发，
# 打包后立刻用**产物自己**跑一次 --acl-doctor 真连自检，缺密钥或自检不通就构建失败。
on:
  push:
    branches: [ main ]
    paths:
      - 'b2bcollect_build/**'
      - '.github/workflows/build-b2bcollect-mac.yml'
      - 'enf_clean/**'
      # 跨目录引用的采集器源码也必须触发重打包（2026-11-12 实机的第二类「静默失效」）：
      # site_adapters 运行时要从包里 import ali1688_build / riskbird_build 的 .py，
      # 这两个目录改了却不重打包，发出去的产物就永远是旧的那一份——症状不是报错，
      # 而是「代码明明修好了，用户那边还是坏的」，排查会一路查到用户机器上去。
      # 由构建前硬门 check_packaging_manifest.py 反查这两个目录确实列在触发 paths 里。
      - 'ali1688_build/**'
      - 'riskbird_build/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    # 与 Windows 版一致：同一工具的新提交自动取消仍在排队的旧构建
    concurrency:
      group: build-b2bcollect-mac-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python (arm64)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Packaging manifest gate
      # 与 Windows 版同一道构建前硬门：把 site_adapters.EXTERNAL_MODULES 声明的跨目录
      # 模块、本目录模块与随包数据文件和下面 PyInstaller 的 --add-data/--hidden-import
      # 逐项对拍，缺一项就不许开建（两个平台各抄一份清单，正是「本机正常、别人少功能」
      # 这类缺陷的温床）。纯标准库，不依赖后面的 pip 安装。
      shell: bash
      run: python .github/scripts/check_packaging_manifest.py

    - name: Write bundled config.json from Secrets
      # 密钥值只经 env 传进进程，脚本绝不打印；缺 OSS 两个 Secret 当场失败。
      shell: bash
      env:
        OSS_AK_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
        OSS_AK_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        python .github/scripts/inject_build_config.py

    - name: Install dependencies
      # 清单与 Windows 版 build-b2bcollect.yml 逐行对齐；pillow 是马可波罗图片码
      # 识别链路（mk_phone_ocr.py 顶层 from PIL import Image）的硬依赖，缺它整个
      # .app 启动即 ModuleNotFoundError；xlrd 是读旧版 .xls 的依赖（全盘扫描会碰到），
      # 函数内 try-import，两边都显式写上防依赖分析口径变化。
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 selenium openpyxl requests websocket-client beautifulsoup4 lxml pillow pyinstaller phonenumbers pandas xlrd -i https://pypi.tuna.tsinghua.edu.cn/simple

    - name: Download chromedriver (Stable mac-arm64)
      run: python .github/scripts/fetch_chromedriver_mac_arm64.py

    - name: Build .app with PyInstaller
      # 与 Windows 版同一套 hidden-import/datas 清单（pip 名≠import 名两个都写）；
      # macOS 用 --windowed 出 onedir .app（不用 --onefile：解包慢且杀软/ Gatekeeper 更折腾），
      # 路径分隔符用「:」，chromedriver 打进 _MEIPASS 根（chrome_driver.candidates frozen 首选位）。
      run: |
        cd b2bcollect_build
        # 随包配置必须真的存在才许开建：少了它，产物就是个「外部机器一律精简版」的包
        [ -f config.json ] || { echo "::error::b2bcollect_build/config.json 不存在（上一步注入没成功），不许出包"; exit 1; }
        python -m PyInstaller --noconfirm --clean --windowed --name B2bCollectTool --collect-all selenium --collect-all PyQt5 --collect-all lxml --collect-all bs4 --collect-submodules PIL --hidden-import requests --hidden-import websocket --hidden-import websocket_client --hidden-import openpyxl --hidden-import cdp_base --hidden-import shared_chrome --hidden-import parallel_session --hidden-import mic_crawler --hidden-import b2b168_crawler --hidden-import qihuo11467_crawler --hidden-import aipage_crawler --hidden-import maimaib2b_crawler --hidden-import gi_crawler --hidden-import makepolo_crawler --hidden-import mk_phone_ocr --hidden-import province_filter --hidden-import site_adapters --hidden-import pending_companies --hidden-import keyword_expander --hidden-import deepseek_expander --hidden-import gongchang_crawler --hidden-import customer_library_cleaner --hidden-import enhanced_cleaner --hidden-import enf_clean.normalize --hidden-import enf_clean.phone --hidden-import phonenumbers --hidden-import pandas --hidden-import xlrd --hidden-import local_scan --hidden-import yzd_client --hidden-import task_registry --hidden-import oss_pool_client --hidden-import data_pool --hidden-import pool_matcher --hidden-import pool_dialogs --hidden-import access_guard --hidden-import edition --hidden-import acl_admin_dialog --hidden-import feedback_store --hidden-import search_suggest --hidden-import recommend_engine --hidden-import dedup_engine --hidden-import mapping_recommender --hidden-import audit_logger --hidden-import search_optimizer --hidden-import pool_merge --hidden-import ingest_cleaning --hidden-import pool_store --hidden-import tool_config --add-data "config.json:." --add-data "mk_phone_font.json:." --add-data "../enf_clean:enf_clean" --add-data "../ali1688_build/ali1688_crawler.py:ali1688_build" --add-data "../riskbird_build/qizhidao_crawler.py:riskbird_build" --add-data "../riskbird_build/block_guard.py:riskbird_build" --add-data "../riskbird_build/chrome_driver.py:riskbird_build" --add-data "../riskbird_build/riskbird_crawler_v2.py:riskbird_build" --add-data "../riskbird_build/aiqicha_crawler_v2.py:riskbird_build" --add-data "../riskbird_build/runtime_paths.py:riskbird_build" --add-data "../mac_driver/chromedriver:." b2bcollect_gui.py

    - name: Artifact doctor gate (B2bCollectTool.app --acl-doctor)
      # 发包门禁：**用产物自己**验证「这个 .app 能不能连上权限服务」，放在打成
      # zip 之前——不通就不许有制品可下。直接调 .app 里的可执行文件：它走的才是
      # 打包态真实凭证链（随包 config.json）与真实 frozen 判定，源码跑通不代表它通。
      # 必须带超时：这一步的失败形态里最坏的一种不是非零退出，而是**一声不响地
      # 卡住**（参数没认出来就会去建界面、网络半通时也会等），一卡就是 job 默认
      # 的 6 小时，日志里什么结论都留不下。自检自己是有界的，这里再兜一层。
      timeout-minutes: 10
      shell: bash
      run: |
        # Actions 的 bash 步默认带 -e：自检不通会在拿到 rc 之前就把整步带走，下面那句
        # ::error:: 注解永远打不出来——门禁还是拦住了，但日志里只有一句 exit code 1，
        # 远程排障的人分不清是「产物坏了」还是「这一步自己坏了」。所以显式收住退出码。
        set +e
        b2bcollect_build/dist/B2bCollectTool.app/Contents/MacOS/B2bCollectTool --acl-doctor
        rc=$?
        set -e
        # 报告文件按「刚被写过」查找，不写死 dist/b2bcollect_state：落点由产物自己的
        # state_dir 候选链决定，写死的路径一变就静默 cat 不到东西（Windows 那一步同理）。
        log=$(find b2bcollect_build/dist -name acl_doctor.txt -mmin -10 2>/dev/null | head -1 || true)
        if [ -n "$log" ]; then
          echo "· 自检报告原文：$log"
          cat "$log"
        else
          echo "· （没找到本次的 acl_doctor.txt，以上面的标准输出为准）"
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::产物自检未通过（退出码 ${rc}）：这个包发出去只会是精简版，禁止上传"
        fi
        exit "$rc"

    - name: Window smoke gate on a read-only bundle copy
      # 窗口冒烟门禁（2026-11-12 Mac 实机崩溃的永久判据）：把 dist 里那份 .app 拷到临时
      # 目录、整树 chmod 成只读，再让**产物自己**把界面真建一遍。必须先拷出来才改权限：
      # dist 里那一份接下来还要打成 zip 交付，权限动不得。
      # 为什么离线回归替不了这一步：用户那份崩溃日志的最后一行是
      #   OSError: [Errno 30] Read-only file system: .../AppTranslocation/.../riskbird_data
      # 它是「打包态 + 只读卷」叠在一起才出现的形态，源码态永远复现不了；而 --acl-doctor
      # 验的是凭证、通道与落点纪律，刻意不碰 Qt——于是「双击开不出界面」这一整类故障在
      # 当时的门禁里是全绿的，只能在用户身上发现。Mac 那一崩在 build_list_channels（建窗口
      # 的下半程），Windows 那一崩在模块 import（建窗口的上半程），两段都在 doctor 射程外。
      # 三条判据一起才算过，各挡一种「绿得没意义」：
      #   1) 退出码 0                      —— 窗口真建出来了；
      #   2) 临时 HOME 下没有崩溃日志       —— 挡住「异常被上层吞掉、界面勉强开出来」的半坏；
      #      （只查退出码会放过它，只查日志又会放过「压根没建窗口」）
      #   3) 副本树里的文件数一个都没多      —— 挡住「没被转置的机器上写进应用包」：那种
      #      形态写入成功、不报错，代价是升级覆盖或拖进废纸篓时用户几个月的 Cookie 与缓存
      #      跟着一起消失，正是本轮纪律要根治的东西。
      # 最后那句 touch 是给**仿真本身**立的判据：chmod 万一不生效（挂载方式或权限模型变了），
      # 这一步会绿得毫无意义——仿真失效比没有仿真更坏。
      # HOME 与 QT_QPA_PLATFORM 都指进临时/offscreen：门禁不碰 runner 的真实配置，也不赌
      # 「这台机器恰好有可用的窗口会话」——那种红了分不清是包坏了还是机器没桌面。
      timeout-minutes: 10
      shell: bash
      run: |
        STAGE=$(mktemp -d)
        # 退出前必须先把写权限还回去再删：只读的那棵树里 rm 连自己父目录的子项都删不掉
        # （解除链接要的是**目录**的写权限），trap 少这一句就会在 job 收尾时留一地删不
        # 掉的临时文件，runner 的清理还会顺带红一条与自己无关的错误。
        trap 'chmod -R u+w "$STAGE" 2>/dev/null || true; rm -rf "$STAGE"' EXIT
        APP="$STAGE/B2bCollectTool.app"
        BIN="$APP/Contents/MacOS/B2bCollectTool"
        [ -d "b2bcollect_build/dist/B2bCollectTool.app" ] || { echo "::error::没找到 dist/B2bCollectTool.app（产物布局变了？先修构建那一步）"; exit 1; }
        cp -R b2bcollect_build/dist/B2bCollectTool.app "$STAGE/"
        chmod -R a-w "$APP"
        [ -x "$BIN" ] || { echo "::error::只读副本里没有可执行文件：$BIN"; exit 1; }
        if touch "$APP/Contents/Info.plist" 2>/dev/null; then
          echo "::error::这份副本没被改成只读（Info.plist 仍可写）：仿真失效，这一步绿了也不代表产物没问题"
          exit 1
        fi
        before=$(find "$APP" | wc -l)
        mkdir -p "$STAGE/home"
        set +e
        env HOME="$STAGE/home" QT_QPA_PLATFORM=offscreen "$BIN" --ui-smoke
        rc=$?
        set -e
        stray=$(find "$STAGE/home" -name "*.log" 2>/dev/null || true)
        after=$(find "$APP" | wc -l)
        if [ -n "$stray" ]; then
          echo "$stray" | while read -r f; do
            [ -n "$f" ] || continue
            echo "—— 崩溃日志 $f ——"
            cat "$f"
          done
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::只读包上窗口没建出来（退出码 ${rc}）：用户双击打开就是这个样子，禁止上传"
          exit "$rc"
        fi
        if [ -n "$stray" ]; then
          echo "::error::窗口建成了却留下崩溃日志：启动路径上有异常被吞掉了，两者不能同时成立"
          exit 1
        fi
        if [ "$before" != "$after" ]; then
          echo "::error::只读副本里多出了文件（${before} → ${after}）：启动路径上有代码往应用包里写东西（转置时它会当场崩，没转置时它会把用户数据塞进包里）"
          exit 1
        fi
        echo "✅ 只读包窗口冒烟通过：界面建得出、崩溃日志一份都没有、包内一字节没多"

    - name: Zip app bundle (ditto preserves perms/attrs)
      run: ditto -c -k --keepParent b2bcollect_build/dist/B2bCollectTool.app B2bCollectTool_Mac_arm64.zip

    - name: Upload Mac artifact
      uses: actions/upload-artifact@v4
      with:
        name: B2bCollectTool-Mac
        path: B2bCollectTool_Mac_arm64.zip
