    - name: Provision VS2015U3 redist (Win7 UCRT 替换源，钉版本 + 校验 sha256)
      # 由来（2026-11-21 台账第 11 项第二轮取证）：第一版修法取 runner 上的 Windows SDK
      # Redist\ucrt——云端 run#5 当场证伪：runner 只有 26100 一档，那份 ucrtbase 是 Win10
      # 构建，照样依赖 Win8 契约模块。三条「完整 Win7 UCRT」的路逐一实测后只剩这一条：
      # VS2015U3 redist（14.0.24215.1）的附加容器 a10 = 完整 app-local UCRT 套件 47 件
      #（本机从官方原件纯标准库解出、47/47 逐字节对拍过）。KB2999226 独立 MSU 内层全是
      # PA delta（确认没有完整字节），旧档 SDK runner 上没有（确认没有）。
      # 与主通道 Provision VC++ redist 同一套纪律：版本化 URL + sha256 钉死（download.microsoft.com
      # 的历史版本长期不删）；哈希从标准输入喂 sha256sum，输出里没有文件名可转义。
      # 注意这份与安装器 deps 里那份**不是同一个文件**：那份是最新版（给 Win10 补装用），
      # 这份钉在 2015U3（只有它的 a10 才是 Win7 完整 UCRT）——两份各钉各的，不共用。
      shell: bash
      env:
        WIN7_UCRT_REDIST_URL: "https://download.microsoft.com/download/6/A/A/6AA4EDFF-645B-48C5-81CC-ED5963AEAD48/vc_redist.x64.exe"
        WIN7_UCRT_REDIST_SHA256: "da66717784c192f1004e856bbcf7b3e13b7bf3ea45932c48e4c9b9a50ca80965"
      run: |
        set -u
        # 哈希取法的格式依据（出处＝SHA-256 的定义本身，不依赖 sha256sum 的行文话术，
        # 与主通道 Provision VC++ redist 那一步同源）：摘要就是 64 位十六进制，所以只收
        # 64 位十六进制；从标准输入喂 sha256sum 是因为输出里没有文件名可转义——GNU 工具
        # 在带反斜杠的文件名上会给整行加转义前缀，awk '{print $1}' 会拿到 \fcdce…。
        # （这里必须双写反斜杠：本常量是普通三引号串，单反斜杠紧跟 f 会被 Python
        # 解成换页符 0x0C 写进 yml——YAML 拒收控制字符，整条流水 jobs=0 静默失败，
        # legacy run#6 实发；连这句注释本身都不能写出那个转义序列，否则它自己就是雷。）
        REDIST="$GITHUB_WORKSPACE/vc2015u3_x64.exe"
        curl -sSLf --retry 3 --connect-timeout 20 --max-time 300 -o "$REDIST" "$WIN7_UCRT_REDIST_URL" \
          || { echo "::error::VS2015U3 vc_redist.x64.exe 下载失败（微软官方 CDN 抖动，重跑一次；连红就是钉住的 URL 失效了，找新的版本化地址重钉）"; exit 1; }
        got=$(sha256sum < "$REDIST" | grep -oE "[0-9a-fA-F]{64}" | head -1 || true)
        [ "$got" = "$WIN7_UCRT_REDIST_SHA256" ] || {
          echo "::error::VS2015U3 redist 的 sha256 与钉住的值不一致：期望 $WIN7_UCRT_REDIST_SHA256 实际 ${got:-无}。这份钉的是 2015U3 历史版（字节不该变）——对不上多半是下错了文件或 URL 被重定向，本机实拉一份重算再重新钉，绝不带着旧哈希放过新字节"; exit 1; }
        echo "· Win7 UCRT 替换源：$(wc -c < "$REDIST") 字节，sha256 已校验（VS2015U3 14.0.24215.1）"

    - name: Swap in Win7-compatible UCRT (装配期换掉 Win11 版运行库)
      # 由来（2026-11-21 取证，legacy run#4）：42 项存根红只是第一层——包内那份 Win11 版
      # ucrtbase.dll 自己就静态依赖 api-ms-win-core-synch-l1-2-0.dll（Win8 才有的契约
      # 模块）：存根在位时 PE 门按「随包桩导出表实测」放行，存根一剪它立刻变红。所以光剪
      # 存根不够，必须把 ucrtbase + api-ms-win-crt-* 整套换成 Win7 兼容版。
      # 第二轮修法（run#5 证伪 SDK 来源后，用户拍板）：替换源改上一步钉死的 VS2015U3
      # redist——脚本用纯标准库从 burn 容器里抽含 ucrtbase 的那套（实测=a10，47 件），
      # 不依赖 expand/cabextract（「存在」不等于「本平台可执行」）。替换件先过
      # check_pe_floor 同一把尺子（随包桩表给 a10 自己的桩集：VS2015 版 ucrtbase 也依赖
      # synch，但 a10 自带那个桩且实测导出 Sleep），替换后再做前后差分覆盖对拍，
      # 新增缺口即 fail-closed——不凭记忆写 Windows 行为，用字节说话。
      # 为什么不在安装器里补 KB2999226 而要在装配期换：绿色版 zip 不经过安装器，
      # app-local 替换让两种交付形态都不依赖用户机器上装没装过那个补丁。
      # 为什么不走构建期排除：PyInstaller 那一步是共享步骤（第 42 条对拍），而 UCRT
      # 是它从 runner 的 System32 扫依赖带进来的，排除参数拦不住；这一整步只在兼容
      # 通道存在，主通道根本不跑（Win10 不需要）。
      shell: bash
      run: |
        set -u
        python .github/scripts/swap_win7_ucrt.py --dist-dir b2bcollect_build/dist/B2bCollectTool \
          --redist "$GITHUB_WORKSPACE/vc2015u3_x64.exe"

    - name: PE floor gate (产物字节里写着的最低 Windows 版本)
      # 需求 10B 里唯一能在**没有 Win7 实机**的情况下机械量出来的一格。为什么量这个：
      # Windows 加载器映射镜像时会把可选头里的 MajorSubsystemVersion/MinorSubsystemVersion
      # 与自身版本比对，镜像要得比系统新就当众拒载——用户看到的就是需求 10 那两句英文
      # 错误，而 PyInstaller、makensis、CI 全都只关心「我有没有写出这个文件」，**构建一句
      # 错都不报**。也就是说「能不能在老系统上加载」早就写在字节里了，只是没人去读。
      # 扫整个 dist 目录而不是只扫主 exe：真实地板由它加载的每一个二进制里最高的那一格
      # 决定（python38.dll / Qt5Core.dll / 随包 chromedriver / selenium-manager.exe），
      # 只测入口的结论等于没测。
      # 诚实边界（脚本里也是这么写的，这里不许拔高）：这一格只证「加载器那一关不拦」，
      # **不**证「Win7 双击一定可用」——运行库是否装齐、驱动能否起来、字体/显卡回退都不在
      # 这张表里。前者由安装器体检补装（需求 10 已交付），后者必须回 Win7 实机验收。
      # 【实测剪 selenium-manager.exe】run#2 实测：它静态导入
      # kernel32!GetSystemTimePreciseAsFileTime（Win8 起）——Win7 的加载器会当场拒掉它。
      # 为什么剪掉而不是把门调松：这个 helper 只在「随包驱动都不配套、要联网现下」那一支
      # 用到，而 Win7 上 Chrome 最高 109、本通道已随包 107/108/109 三档；即使落到那一支，
      # 它在 Win7 上也跑不起来——留着一个开不了的二进制只会多一处 0xc0000139。
      # 为什么不走构建期排除：PyInstaller 那一步是**共享步骤**（第 42 条只允解释器那一
      # 个 token 不同），在它那里加排除会连带改掉正在出货的主通道；而这一整步只在
      # 兼容通道存在，主通道根本不跑 PE 地板门（Win10 不需要）。
      # --prune-keep 是「哪怕通配命中也不许剪」的那道框：入口 exe 被剪掉的话，剩下的
      # 就是一堆开不了的零件。
      # 【api-ms-win-core-* 的剪枝已退役（第三轮，run#8 取证）】run#4 时代 dist 里那
      # 30 个 core 存根是 PyInstaller 扫依赖带进来的 Win11 孤儿（地板 10.0），当时 UCRT
      # 替换只换 crt+ucrtbase，剪掉它们是唯一的去留手段；现在替换步从 a10 redist 整套
      # 拷贝 core+crt+ucrtbase 覆盖同名 Win11 镜像——剪枝对象已被换成合格镜像，其中
      # api-ms-win-core-synch 转发器还是替换后 ucrtbase 的加载依赖，同一条 glob 会反
      # 手把刚带进包里的支撑桩剪掉。run#8 正是门绿而产物自检 0xC0000409 fastfail，
      # 首嫌就是那条剪枝把 UCRT 掏空（取证步在下一步单独量）。--max-prune 40 维持：
      # 现测只剪 selenium-manager 一件，上限是给「新桩来源先停下来问人」留的余量。
      shell: bash
      run: |
        set -u
        cd b2bcollect_build
        python ../.github/scripts/check_pe_floor.py --scan-dir dist/B2bCollectTool --floor 6.1 \
          --prune-match selenium-manager.exe \
          --prune-keep B2bCollectTool.exe --max-prune 40

    - name: Legacy crash forensics (doctor 前的取证：只在兼容通道跑)
      # 由来（run#8，2026-11-21）：legacy 产物第一次活到产物自检步，B2bCollectTool.exe
      # --acl-doctor 以 0xC0000409（fastfail/无效参数那一族）退出且没留下
      # acl_doctor.txt——共享步只报退出码，分不出「bootloader 就炸」还是「doctor 逻辑炸」。
      # 这一步用三发取证把范围夹出来：甲 `--version` 对照（最轻入口，也炸就是启动段）；
      # 乙 把 stdout/stderr 带回来（python 层异常会留字，fastfail 不会）；丙 列替换现场
      # （ucrtbase/synch 桩在不在、多大、哈希前 8 位——剪子是不是把 a10 支撑桩剪了，在这里见分晓）。
      # 这一步的取证形状在 run#9 后升过一级：甲/乙改 Start-Process -Wait -PassThru 的
      # 可靠调用（run#9 实发 & 直接调用对 fastfail 进程拿到 rc=空——读不出，不许当成
      # 「没炸」；同一步里共享自检步的 Start-Process 形状拿到了 -1073740791，证明形状可信）。
      # 它不在共享十步里，不会破第 42 条的逐字节对拍；主通道不跑这一步。
      shell: pwsh
      run: |
        $exe = "b2bcollect_build\dist\B2bCollectTool\B2bCollectTool.exe"
        Write-Host "── 甲：最轻入口对照 ──"
        $o1 = "$env:RUNNER_TEMP\diag_version.out"; $e1 = "$env:RUNNER_TEMP\diag_version.err"
        $pv = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $o1 -RedirectStandardError $e1
        Write-Host "--version rc=$($pv.ExitCode)"
        Get-Content $o1 -TotalCount 5 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "out: $_" }
        Get-Content $e1 -TotalCount 5 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "err: $_" }
        Write-Host "── 乙：doctor 带 stdout/stderr ──"
        $o2 = "$env:RUNNER_TEMP\diag_doctor.out"; $e2 = "$env:RUNNER_TEMP\diag_doctor.err"
        $pd = Start-Process -FilePath $exe -ArgumentList "--acl-doctor" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $o2 -RedirectStandardError $e2
        $drc = $pd.ExitCode
        Get-Content $o2 -TotalCount 30 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "out: $_" }
        Get-Content $e2 -TotalCount 10 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "err: $_" }
        Write-Host "── 丙：替换现场清点 ──"
        $d = "b2bcollect_build\dist\B2bCollectTool\_internal"
        foreach ($n in @("ucrtbase.dll", "api-ms-win-core-synch-l1-2-0.dll", "api-ms-win-crt-runtime-l1-1-0.dll")) {
          $f = Get-ChildItem -Path "b2bcollect_build\dist\B2bCollectTool" -Recurse -Filter $n -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($f) { $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.Substring(0,8); Write-Host "在位 $n size=$((Get-Item $f.FullName).Length) sha256前8=$h" } else { Write-Host "不在包 $n" }
        }
        $core = @(Get-ChildItem -Path "b2bcollect_build\dist\B2bCollectTool" -Recurse -Filter "api-ms-win-core-*.dll" -ErrorAction SilentlyContinue).Count
        Write-Host "包里 api-ms-win-core-* 总数=$core"
        Write-Host "── 丁：分层对照实验（run#9 取证升级；剪枝假设已证伪，桩全在仍 fastfail）──"
        # run#9 实测三件：PE 门绿、a10 全套在位（ucrtbase B2C22623 / synch / crt-runtime）、
        # doctor 仍 0xC0000409——「剪枝掏空」首嫌证伪。差异面只剩：3.8 构建本身 vs swap 引入的
        # app-local a10 UCRT。机制假设：Win10+ 上 app-local ucrtbase 是不受支持的覆盖（官方
        # UCRT 文档：它是系统组件；main 通道 app-local 是 Win11 同版本所以从不炸），一旦经
        # 基名解析/显式加载进来，与系统 CRT 串扰 → invoke_watson → fastfail。丁三档把它夹出来：
        # A 只移 ucrtbase.dll／B 只移 api-ms-* 转发器／C 整套移走；每档跑 --version 记 rc、跑
        # doctor 记 rc，**立刻还原**并核对计数，还原不彻底就地拦停（不许留半还原状态出包）。
        # 读数表：C 绿且 A 绿 → app-local ucrtbase 是炸点；C 绿而 A 红 → 炸在转发器组合；
        # C 也红 → 与 UCRT 无关，转 3.8 构建启动段排查。
        function Run-Diag([string]$tag) {
          $ov = "$env:RUNNER_TEMP\dv_$tag.out"; $ev = "$env:RUNNER_TEMP\dv_$tag.err"
          $p1 = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $ov -RedirectStandardError $ev
          Write-Host "[$tag] --version rc=$($p1.ExitCode)"
          Get-Content $ev -TotalCount 3 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "[$tag] err: $_" }
          $od = "$env:RUNNER_TEMP\dd_$tag.out"; $ed = "$env:RUNNER_TEMP\dd_$tag.err"
          $p2 = Start-Process -FilePath $exe -ArgumentList "--acl-doctor" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $od -RedirectStandardError $ed
          Write-Host "[$tag] acl-doctor rc=$($p2.ExitCode)"
          Get-Content $ed -TotalCount 3 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "[$tag] err: $_" }
        }
        function Move-Ucrt([string]$tag, [string[]]$patterns) {
          $stg = Join-Path $env:RUNNER_TEMP ("ucrt_" + $tag)
          if (Test-Path $stg) { Remove-Item $stg -Recurse -Force }
          New-Item -ItemType Directory -Path $stg | Out-Null
          $moved = @()
          foreach ($pat in $patterns) {
            @(Get-ChildItem -Path $d -Recurse -Filter $pat -ErrorAction SilentlyContinue) | ForEach-Object {
              Move-Item -LiteralPath $_.FullName -Destination (Join-Path $stg $_.Name)
              $moved += $_.FullName
            }
          }
          return $moved
        }
        function Restore-Ucrt([string]$tag, [string[]]$moved) {
          $stg = Join-Path $env:RUNNER_TEMP ("ucrt_" + $tag)
          foreach ($full in $moved) {
            Move-Item -LiteralPath (Join-Path $stg (Split-Path $full -Leaf)) -Destination $full
          }
          $ubu = @(Get-ChildItem -Path $d -Recurse -Filter "ucrtbase.dll" -ErrorAction SilentlyContinue).Count
          if ($ubu -lt 1) { Write-Host "::error::丁档 $tag 还原后 ucrtbase 不在位（实验污染了产物，禁止带着半还原状态继续出包）"; exit 1 }
        }
        Run-Diag "S0"
        $mva = Move-Ucrt "A" @("ucrtbase.dll")
        Run-Diag "A"; Restore-Ucrt "A" $mva
        $mvb = Move-Ucrt "B" @("api-ms-win-core-*.dll", "api-ms-win-crt-*.dll")
        Run-Diag "B"; Restore-Ucrt "B" $mvb
        $mvc = Move-Ucrt "C" @("ucrtbase.dll", "api-ms-win-core-*.dll", "api-ms-win-crt-*.dll")
        Run-Diag "C"; Restore-Ucrt "C" $mvc
        Write-Host "── 戊：同 3.8 最小构建三探针（run#10 丁读数：四档全红，app-local UCRT 假设证伪）──"
        # run#10 实测：S0/A/B/C 四档的 --version 与 doctor 全部 rc=-1073740791，整套 UCRT
        # 移走也炸——app-local UCRT（a10 或系统原版）与炸点无关；同 runner 主通道 3.11 产物
        # 全绿。差异面缩到「PyInstaller 拿 3.8 打出来的产物本身」。戊把「3.8×PyInstaller
        # 6.22.3×这台 runner 的工具链」与「本项目的构建参数」夹开：同一解释器同一
        # PyInstaller 打最小 hello.py，onefile/windowed/onedir 各跑一次。
        # 读数：任一档炸 → 工具链×runner 不兼容（换 PyInstaller 钉版本或换构建形状）；
        # 全绿 → 项目参数/依赖问题，下一轮从 --windowed/--collect-all/Qt5 二分。
        $mini = Join-Path $env:RUNNER_TEMP "mini38"
        if (Test-Path $mini) { Remove-Item $mini -Recurse -Force }
        New-Item -ItemType Directory -Force -Path $mini | Out-Null
        Set-Content -Path (Join-Path $mini "hello.py") -Value 'print("hello38")' -Encoding UTF8
        Push-Location $mini
        & $env:TARGET_PY -m PyInstaller --noconfirm --clean --onefile --distpath d1 --workpath w1 hello.py 2>&1 | Select-Object -Last 2 | ForEach-Object { Write-Host $_ }
        $p1m = Start-Process -FilePath (Join-Path (Join-Path $mini "d1") "hello.exe") -NoNewWindow -Wait -PassThru -RedirectStandardOutput (Join-Path $mini "h1.out")
        Write-Host "[戊-onefile] rc=$($p1m.ExitCode)"
        Get-Content (Join-Path $mini "h1.out") -TotalCount 1 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "[戊-onefile] out=$_" }
        & $env:TARGET_PY -m PyInstaller --noconfirm --clean --windowed --onefile --distpath d2 --workpath w2 hello.py 2>&1 | Select-Object -Last 2 | ForEach-Object { Write-Host $_ }
        $p2m = Start-Process -FilePath (Join-Path (Join-Path $mini "d2") "hello.exe") -NoNewWindow -Wait -PassThru
        Write-Host "[戊-windowed] rc=$($p2m.ExitCode)"
        & $env:TARGET_PY -m PyInstaller --noconfirm --clean --onedir --distpath d3 --workpath w3 hello.py 2>&1 | Select-Object -Last 2 | ForEach-Object { Write-Host $_ }
        $p3m = Start-Process -FilePath (Join-Path (Join-Path (Join-Path $mini "d3") "hello") "hello.exe") -NoNewWindow -Wait -PassThru
        Write-Host "[戊-onedir] rc=$($p3m.ExitCode)"
        # run#11 实读：三探针全绿且 --version 形状探针也绿——「工具链×runner」无罪。
        # 剩两格未钉：①windowed 产物带参数（主产物自检的形状）；②本项目构建参数。
        # 戊2/戊3 一枪夹完。两处的调用形状都**逐字对齐共享自检步**（Start-Process -Wait
        # -PassThru、不 Redirect、不 -NoNewWindow）：那一形状 run#10 已实证读得到 legacy
        # 产物的 fastfail、run#11 已实证读得到最小产物的 rc=0——取证工具自己先可信（§15 第 9
        # 条）。前一版戊2 用 & + $LASTEXITCODE：run#9 实证 & 对 fastfail 进程拿到 rc=空
        # （读不出，不许当成没炸）；PYTHONUNBUFFERED 也是未经验证的额外变量，一并撤。
        # 戊3 的构建形状忠实抄主构建的相对路径基准：PyInstaller 6.22.3 源码（本机同版本
        # 实查 build_main.py）——相对脚本与 --add-data 一律按 **spec 文件所在目录**解析
        # （"relative to the location of .spec file"），所以**不能传 --specpath $mini**：
        # 那会把 ../enf_clean、config.json、b2bcollect_gui.py 全指到 RUNNER_TEMP 下去找，
        # 得到的是取证工具自身炸的假红。不传则 spec 落 cwd（Push-Location 后的
        # b2bcollect_build），与主构建逐字同基准；dist/workpath 仍隔离在 $mini 不污染真产物。
        # 读数表：戊2 绿戊3 红 → 完整参数形状复现，下轮从 --collect-all selenium / Qt5 二分；
        # 戊2 红 → windowed+继承 stdout 带参这个形状本身在这条 runner 的自检路上不可用
        # （真机仍可能好的，但自检验证路要改形状）；两枪全绿 → 半项目规模没复现，参数面
        # 继续往全量加。
        $p2c = Start-Process -FilePath (Join-Path (Join-Path $mini "d2") "hello.exe") -ArgumentList "--version" -Wait -PassThru
        Write-Host "[戊2-windowed带参继承stdout] rc=$($p2c.ExitCode)"
        Push-Location "$env:GITHUB_WORKSPACE/b2bcollect_build"
        & $env:TARGET_PY -m PyInstaller --noconfirm --clean --windowed --name p3hello --distpath "$mini/d4" --workpath "$mini/w4" --add-data "config.json;." --add-data "version.json;." --add-data "../enf_clean;enf_clean" --add-data "../ali1688_build/drivers;drivers" --collect-all selenium --collect-all lxml --collect-all bs4 --exclude-module numpy --hidden-import requests --hidden-import phonenumbers --hidden-import access_guard --hidden-import edition --hidden-import text_shape --hidden-import tool_version b2bcollect_gui.py 2>&1 | Select-Object -Last 3 | ForEach-Object { Write-Host $_ }
        Pop-Location
        # 产物不在位 = 构建这步自己失败（取证工具故障，不是启动判定），点名说清并保留
        # 步末 doctor 判定，绝不把「没构建出来」读成 rc=空 的启动结论。
        $exe3 = Join-Path (Join-Path (Join-Path $mini "d4") "p3hello") "p3hello.exe"
        if (-not (Test-Path $exe3)) {
          Write-Host "::error::戊3 没有产出 p3hello.exe：这是构建步自身失败（上面最后三行是原因），属取证工具故障而非启动判定；步末 doctor 判定不受影响"
        } else {
          $p3b = Start-Process -FilePath $exe3 -ArgumentList "--version" -Wait -PassThru
          Write-Host "[戊3-半项目构建] rc=$($p3b.ExitCode)"
        }
        Pop-Location
        if ($drc -ne 0) { Write-Host "::error::doctor 仍未通过（rc=${drc}）：上面甲乙丙丁戊的取证与读数就是下一步的分工依据，不许用重跑掩盖" ; exit $drc }

    - name: Artifact doctor gate (B2bCollectTool.exe --acl-doctor)
      # 发包门禁：**用产物自己**验证「这个 exe 能不能连上权限服务」。放在上传之前，
      # 不通就不许有制品可下。必须走 --windowed 的 exe，所以用 Start-Process -Wait
      # 拿退出码（GUI 子系统程序在 shell 里不会被自然等待，这是 Windows 上的老坑）；
      # 报告同时落在包外状态目录 acl_doctor.txt，失败时把原文打出来供远程排障。
      # 必须带超时：这一步最坏的失败形态不是非零退出，而是**一声不响地卡住**
      # （参数没被认出来就会走到建界面那条路，runner 上多半也没有可用图形会话），
      # 一卡就是 job 默认的 6 小时，日志里连一行自检结论都留不下。exe 里的自检
      # 本身是有界的（网络侧全部带超时与重试上限），这里再兜一层防「没走到那里」。
      # onedir 之后 exe 住在 dist\B2bCollectTool\ 里，自检报告也落在它同级的
      # b2bcollect_state 下；这里用递归查找而不是写死路径，将来布局再变（比如
      # _internal 挪位置）也不会出现「产物是好的、门禁读错了文件」这种假失败。
      timeout-minutes: 10
      shell: pwsh
      run: |
        $exe = "b2bcollect_build\dist\B2bCollectTool\B2bCollectTool.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "::error::产物没生成到位：${exe}（onedir 布局变了？先修这一步再谈交付）"
          exit 1
        }
        $p = Start-Process -FilePath $exe -ArgumentList "--acl-doctor" -Wait -PassThru
        $log = Get-ChildItem -Path "b2bcollect_build\dist" -Recurse -Filter "acl_doctor.txt" |
               Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($log) { Get-Content $log.FullName } else { Write-Host "（没找到 acl_doctor.txt）" }
        Write-Host "acl-doctor exit code = $($p.ExitCode)"
        if ($p.ExitCode -ne 0) {
          Write-Host "::error::产物自检未通过（退出码 $($p.ExitCode)）：这个包发出去只会是精简版，禁止上传"
          exit $p.ExitCode
        }

    - name: Window smoke gate (B2bCollectTool.exe --ui-smoke)
      # 与 Mac 那一步同一条判据、同一个入口：让**产物自己**把界面真建一遍，退出码 0 才
      # 许装配交付。（2026-11-12 那份 Windows 崩溃栈停在 ``File "b2bcollect_gui.py",
      # line 39, in <module>``——正好是「建窗口之前的 import」那一段，而 --acl-doctor
      # 刻意不碰 Qt：它验凭证、验通道、验落点，唯独不建窗口。于是「双击开不出界面」这一
      # 整类故障在当天的门禁里是全绿的，只有用户能发现。这一步把那段盲区补成发包判据。）
      # 这里不再模拟只读卷：Windows 本轮的根因是 onefile 的 _MEI 回收赛跑，改 onedir 之后
      # 那个目录压根不存在了；「安装目录写不进去」（装在 Program Files、放共享盘、U 盘）
      # 由 tool_config 与 riskbird_build/runtime_paths 的候选链兜住，那条口径由离线回归
      # 与 --acl-doctor 的落点纪律（退出码 9）两头钉住，不靠这一仿真的运气。
      # QT_QPA_PLATFORM 显式给 offscreen：runner 上有没有交互式桌面不是产品的事，赌它输了
      # 就分不清「包坏了」还是「这台机器没会话」；随包的平台插件收没收到也由这一步的答案
      # 说话——缺 qoffscreen.dll 会红在这里，而不是红在用户的双击上。
      # USERPROFILE 指进临时目录有两个作用：门禁不碰 runner 的真实配置，并且「界面开成了
      # 却留下一份崩溃日志」这种异常被吞掉的半坏状态也能被查出来（只看退出码会放过它）。
      # 排在装配之前是刻意的：这一步会在安装目录里跑出 b2bcollect_state 等运行期目录，正好
      # 由下一步（package_win_artifacts.py）统一剔掉——交付物里绝不带 CI 那台机器的状态。
      timeout-minutes: 10
      shell: pwsh
      run: |
        $exe = "b2bcollect_build\dist\B2bCollectTool\B2bCollectTool.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "::error::产物没生成到位：${exe}（onedir 布局变了？先修构建那一步再谈交付）"
          exit 1
        }
        $stage = Join-Path $env:RUNNER_TEMP "ui-smoke-home"
        if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        $env:QT_QPA_PLATFORM = "offscreen"
        $env:USERPROFILE = $stage
        $env:HOME = $stage
        $p = Start-Process -FilePath $exe -ArgumentList "--ui-smoke" -Wait -PassThru
        Write-Host "ui-smoke exit code = $($p.ExitCode)"
        $stray = @(Get-ChildItem -Path $stage -Recurse -Filter "*.log" -ErrorAction SilentlyContinue)
        foreach ($f in $stray) {
          Write-Host "—— 崩溃日志 $($f.FullName) ——"
          Get-Content $f.FullName
        }
        if ($p.ExitCode -ne 0) {
          Write-Host "::error::窗口没建出来（退出码 $($p.ExitCode)）：用户双击打开就是这个样子，禁止装配交付"
          exit $p.ExitCode
        }
        if ($stray.Count -gt 0) {
          Write-Host "::error::窗口建成了却留下崩溃日志：启动路径上有异常被吞掉了，两者不能同时成立"
          exit 1
        }
        Write-Host "✅ 窗口冒烟通过：界面建得出、崩溃日志一份都没有"

    - name: Artifact self-report gate (产物必须自报是哪一版)
      # 需求 2 的第一块在这里合上：不问「上一步做了什么」，而是**问产物自己**「你是哪一版」，
      # 再与这一步注入的那个号对拍。只信前面那些绿不够：--add-data 漏写、PyInstaller 把数据
      # 收到另一个位置、_internal 布局改了——三种都会让「CI 说注入了」与「包读到的」不是
      # 同一个数，而只有后者决定用户机器上的更新提示与远程排障能不能说出真相。
      # --windowed 的 exe 没有控制台，stdout 收不到，所以走 `--out` 那份 JSON（与
      # --acl-doctor 把报告落在文件里同一套路子）。
      # 自报这一步本身恒返 0（连「没能确认」也要能如实打出来），判定由下面的对拍做：
      # 「自报失败」与「自报不一致」是两种不同的红，混在一个退出码里就查不出是哪种。
      # 对拍的那六条判定不在本步里写，而在 .github/scripts/check_artifact_selfreport.py：
      # Mac 那一头跑的是 bash，同样的判定抄两遍就会漂移成「一个平台拦得住、另一个放绿」，
      # 而屏幕上两个 run 都是绿的（本仓库已在 hidden-import 清单、pip 源、落点口径上各吃过
      # 一次）；抽成脚本还多一个好处：这一步从此能被离线判据直接调用，pwsh 在内连脚本里可验不了。
      timeout-minutes: 5
      shell: pwsh
      env:
        EXPECT_BUILD: ${{ github.run_number }}
        EXPECT_COMMIT: ${{ github.sha }}
      run: |
        $exe = "b2bcollect_build\dist\B2bCollectTool\B2bCollectTool.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "::error::产物没生成到位：${exe}（onedir 布局变了？先修这一步再谈交付）"
          exit 1
        }
        $rep = Join-Path $env:RUNNER_TEMP "version_selfreport.json"
        if (Test-Path $rep) { Remove-Item -Force $rep }
        $p = Start-Process -FilePath $exe -ArgumentList "--print-version","--json","--out",$rep -Wait -PassThru
        if ($p.ExitCode -ne 0) {
          Write-Host "::error::产物连自报版本这一步都退 $($p.ExitCode)：这个包说自己是谁都说不出来，禁止上传"
          exit 1
        }
        # 判定不在这里、也不在 Mac 那头各写一遍（那六条全部写在
        # .github/scripts/check_artifact_selfreport.py）：两个平台调同一份、红同一句话，
        # 而且离线判据能直接喂假报告验它（内联在 pwsh 里的话，本机连解释器都没有）。
        python .github/scripts/check_artifact_selfreport.py --report $rep --expect-build $env:EXPECT_BUILD --expect-commit $env:EXPECT_COMMIT --label B2bCollectTool.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Package Windows artifacts
      # onedir 交付装配，三道事一并做（判据全在脚本里，不抄在 yml）：
      #   1) 验布局：dist\B2bCollectTool\ 里 exe + _internal + 随包凭证 + 跨目录采集器
      #      一项不缺，并且**dist 里不许再躺一个旧的单文件 exe**（那个会把本轮修好的
      #      onefile 故障原样带回用户机器）；
      #   2) 剔运行期目录：上一步 --acl-doctor 在 runner 上跑出了 b2bcollect_state 等
      #      目录，那是「CI 那台机器」的状态，绝不能进任何交付物；
      #   3) 打绿色版 zip：顶层固定是一个 B2bCollectTool/ 目录 + 一份使用说明，
      #      给「不让装软件 / 放共享盘」的场景兜底。
      # 这一步排在安装包之前：makensis 用 File /r 拷整棵 dist 树，先剔干净再拷，
      # 安装器与 zip 才是同一份干净布局。
      # 【需求 10B】包名在本步的 env 里钉：兼容通道那份 yml 的这一步 run 体与这里
      # 逐字节相同（第 42 条按步骤名做字节对拍），只有 env 不同。
      shell: bash
      env:
        PORTABLE_NAME: "B2bCollectTool_Win7_portable.zip"
      run: python .github/scripts/package_win_artifacts.py --root b2bcollect_build --portable-name "$PORTABLE_NAME"

    - name: Provision NSIS (钉版本 + 校验 sha256)
      # 第五刀（2026-11-12 Windows 实机）：原来这一步是「在 runner 上找 makensis，
      # 找不到就报错」，红在**所有**产物步骤之后——exe 打好了、--acl-doctor 过了、
      # 绿色 zip 也生成了，只差最后这一步，用户手里还是没有安装包。根因不是脚本写错，
      # 是「工具链依赖这台机器恰好装了什么」：镜像一更新 NSIS 就没了，本机永远复现不了。
      # 业界对这件事的标准答案是 hermetic 构建：自己下载、钉死版本、校验 sha256、解压即用。
      # 镜像里就算有 makensis 也不借用——两次构建用同一个编译器，产物才可比。
      # 下载/校验/解压每一步失败都在这里响，不留给 NSIS 一句谁也看不懂的「文件不存在」。
      shell: bash
      env:
        NSIS_VERSION: "3.10"
        NSIS_SHA256: "fcdce3229717a2a148e7cda0ab5bdb667f39d8fb33ede1da8dabc336bd5ad110"
      run: |
        set -u
        MAJOR=${NSIS_VERSION%%.*}
        DEST="$GITHUB_WORKSPACE/.tools/nsis-$NSIS_VERSION"
        MK="$DEST/Bin/makensis.exe"
        ZIP="$RUNNER_TEMP/nsis-$NSIS_VERSION.zip"
        # 两条官方写法（downloads.sourceforge.net 与 /files 页面那条），都走 HTTPS、
        # 都会被重定向到镜像；一个不通换另一个再试，最后仍用 sha256 收口——
        # 镜像可以换，字节不能换。
        URLS="https://downloads.sourceforge.net/project/nsis/NSIS%20$MAJOR/$NSIS_VERSION/nsis-$NSIS_VERSION.zip
        https://sourceforge.net/projects/nsis/files/NSIS%20$MAJOR/$NSIS_VERSION/nsis-$NSIS_VERSION.zip/download"
        sha256() {
          # 格式依据：这里取的不是「sha256sum/certutil 各自行文里的第几列」，而是 SHA-256
          # 摘要的**定义**——十六进制表示恒为 64 个 hex 字符。所以两条分支同一条规矩：整段
          # 输出里扫 64 位 hex，谁的话术变了都取不到值（取不到就是空串，下面按不等处理）。
          # 反面写法是 `| awk '{print $1}'` 或 `sed -n 2p`：certutil 除了哈希还会印一句
          # 「CertUtil: -hashfile command completed successfully.」，按行号/字段切就有机会
          # 切到那句话上，而本机没有 certutil，这种红只能在云端第一次出现。
          # 只从**内容**算哈希，别让文件名参与输出。这不是洁癖：Git Bash 里 $RUNNER_TEMP
          # 是 `D:\a\...\_temp` 这种带反斜杠的 Windows 路径，而 GNU coreutils 的规定是
          # 「文件名里含反斜杠或换行时，整行输出前面加一个 \\ 作为转义标记」，于是
          # `sha256sum … | awk '{print $1}'` 拿到的是 `\fcdce…`——哈希本身完全正确，却和
          # 钉住的值「对不上」，2026-11-12 那次 CI 就是这么红的。用 < 喂标准输入，输出里
          # 压根没有文件名可转义；再只取 64 位十六进制兜一层，两条分支同规矩。
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum < "$1" | grep -oE "[0-9a-fA-F]{64}" | head -1 || true
          else
            certutil -hashfile "$(cygpath -w "$1")" SHA256 | grep -oE "[0-9a-fA-F]{64}" | head -1 || true
          fi
        }
        if [ ! -f "$MK" ]; then
          got=""
          for round in 1 2 3; do
            for u in $URLS; do
              rm -f "$ZIP"
              curl -sSLf --connect-timeout 20 --max-time 180 -o "$ZIP" "$u" \
                || { echo "· 下载失败（镜像抖动，换下一条）：$u"; continue; }
              got=$(sha256 "$ZIP")
              [ "$got" = "$NSIS_SHA256" ] && break 2
              echo "· 第 $round 轮校验不过（下坏了或没下全）：$got"
            done
          done
          [ "$got" = "$NSIS_SHA256" ] || {
            echo "::error::nsis-$NSIS_VERSION.zip 的 sha256 与钉住的值不一致（或三轮都没下全）：期望 $NSIS_SHA256 实际 ${got:-无}。宁可不打安装包，也不拿一个来路不明的编译器打用户手上的东西"
            exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          # Git Bash 自带 unzip，走不到下面这条；但兜底分支必须是**能跑的**：PowerShell
          # 不认 /d/... 这种 MSYS 路径，直接把 $ZIP 传给它只会得到一句「路径不存在」，
          # 而这一步的失败原因看起来会像「NSIS 包坏了」。（同一句里两处都要 cygpath -w，
          # 别只给 DestinationPath 加——本轮就是这么漏的。）
          if command -v unzip >/dev/null 2>&1; then unzip -q -o "$ZIP" -d "$GITHUB_WORKSPACE/.tools"
          else powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$ZIP")' -DestinationPath '$(cygpath -w "$GITHUB_WORKSPACE/.tools")' -Force" >/dev/null; fi
        fi
        [ -f "$MK" ] || { echo "::error::解压后没找到 ${MK}（NSIS 目录布局变了？别改这一步，改钉住的版本并重新校验）"; exit 1; }
        # 不用 `| head -1`：这个 job 开着 pipefail，head 提前收线会让上游吃一个 SIGPIPE，
        # 于是「版本打印成功」也能变成「这一步失败」——这种红法谁也想不到是管道干的。
        # 写法也不许赌一种：makensis 的选项前缀 / 与 - 都算，可 Git Bash 会把以 / 开头的
        # 参数当**路径**转换（/VERSION → C:/Program Files/Git/VERSION），于是编译器收到的
        # 是个不存在的文件名，回一句 Usage。2026-11-12 云端就是这么红的：sha256 校验早就
        # 过了，红在「版本探测」这一步——探测失败与编译器坏了看起来一模一样。
        # 所以：①几种写法逐个试（统一 MSYS_NO_PATHCONV=1，别LET bash 改写参数）；②探到
        # 版本号就按钉住的值硬对，探不到**不在这里判死**——真正说了算的是下一步编译时
        # makensis 自己印的那行横幅，它用的就是交付这个安装包的那台编译器，不会有「探测
        # 与构建两套结果」的缝隙。
        VOUT=""
        VATTEMPTS=""
        for opt in -VERSION //VERSION /VERSION; do
          out=$(MSYS_NO_PATHCONV=1 "$MK" "$opt" 2>&1 || true)
          first=${out%%$'\n'*}
          VATTEMPTS="${VATTEMPTS}${opt} => ${first}"$'\n'
          case "$first" in
            *v[0-9]*) VOUT="$first"; break ;;
          esac
        done
        if [ -n "$VOUT" ]; then
          case "$VOUT" in
            *v"$NSIS_VERSION"*) echo "· 安装包编译器：${MK}（${VOUT}，sha256 已校验）" ;;
            *) echo "::error::makensis 自报的版本不是钉住的 ${NSIS_VERSION}（实际 ${VOUT}）"
               echo "试过的写法与返回："; printf '%s' "$VATTEMPTS"
               exit 1 ;;
          esac
        else
          echo "· 版本开关这几种写法都没理人，改由安装包那一步用编译器自己的横幅定版（不是放行，是换一处更硬的判据）"
          printf '%s' "$VATTEMPTS"
        fi
        echo "MAKENSIS=$MK" >> "$GITHUB_ENV"
        echo "NSIS_PINNED=$NSIS_VERSION" >> "$GITHUB_ENV"

    - name: Provision VC++ redist (钉版本 + 校验 sha256)
      # 需求 10「任何电脑都无需额外去解决这些问题」的另一半：安装时判出系统缺
      # vcruntime140.dll 就当场静默补装。安装包里必须真带着它，本步骤在 makensis
      # 编译之前把微软官方安装器取到 installer\deps\（nsi 里 !if /FileExists 判存在；
      # 没有这个文件就编出「不带运行库」的包——那一版对纯小白等于没修，所以这一步
      # 失败就是红，绝不静默出包）。
      # 与上面 NSIS 同一套纪律：版本化 URL + sha256 钉死。aka.ms/latest 永远指最新版，
      # 微软一换版字节就变——所以钉的是 download.visualstudio.microsoft.com 的
      # 版本化地址（历史版本长期不删），哈希对不上就当场红。哈希取法沿用 NSIS 那条
      # 教训：从标准输入喂 sha256sum，输出里没有文件名可转义，再只收 64 位十六进制。
      shell: bash
      env:
        VC_REDIST_URL: "https://download.visualstudio.microsoft.com/download/pr/e9604e21-4b79-4096-a4b3-1b63d4b55b4d/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe"
        VC_REDIST_SHA256: "cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b"
      run: |
        set -u
        # 哈希取法的格式依据（出处＝SHA-256 的定义本身，不依赖 sha256sum 的行文话术）：
        # 摘要就是 64 位十六进制，所以只收 64 位十六进制；从标准输入喂 sha256sum 是因为
        # 输出里没有文件名可转义——GNU 工具在带反斜杠的文件名上会给整行加转义前缀，
        # `awk '{print $1}'` 会拿到 \fcdce…：哈希没错，却和钉住的值对不上。
        DEPS="$GITHUB_WORKSPACE/b2bcollect_build/installer/deps"
        REDIST="$DEPS/VC_redist.x64.exe"
        mkdir -p "$DEPS"
        curl -sSLf --retry 3 --connect-timeout 20 --max-time 300 -o "$REDIST" "$VC_REDIST_URL" \
          || { echo "::error::VC_redist.x64.exe 下载失败（微软官方 CDN 抖动，重跑一次；连红就是钉住的 URL 失效了，换新版本化 URL）"; exit 1; }
        got=$(sha256sum < "$REDIST" | grep -oE "[0-9a-fA-F]{64}" | head -1 || true)
        [ "$got" = "$VC_REDIST_SHA256" ] || {
          echo "::error::VC_redist.x64.exe 的 sha256 与钉住的值不一致：期望 $VC_REDIST_SHA256 实际 ${got:-无}。多半是微软换版了——本机实拉一份重算哈希、连同新版本化 URL 一起重新钉上，绝不带着旧哈希放过新字节"; exit 1; }
        echo "· VC++ 运行库：$(wc -c < "$REDIST") 字节，sha256 已校验 → installer/deps/"

    - name: Build Windows installer (NSIS, per-user)
      # 交付形态：目录形态的产物必须靠安装包落到用户机器上，否则「解压到哪都行」会
      # 变成「用户把文件夹删了一半」。这里按业界主流做法做成**每用户安装**：
      #   · 默认目录 $LOCALAPPDATA\Programs\B2bCollectTool —— 用户在配置文件里，
      #     RequestExecutionLevel user 不弹 UAC（VS Code / Slack / Discord 同一路线），
      #     也保证安装目录本身**可写**：Cookie、缓存、自检报告这些运行期数据按
      #     riskbird_build/runtime_paths.py 与 tool_config.state_dir 的口径优先落在
      #     程序同级，装在 Program Files 里就会全部退到用户目录，用户看不见也
      #     说不清「为什么我的登录状态没保住」。
      #   · 卸载信息写 HKCU（不是 HKLM），控制面板里能正常卸载、且不污染机器级注册表。
      # makensis 不在位就直接失败：宁可没有安装包，也绝不静默退化成「只发一个 zip」
      # 却告诉用户「这就是交付物」（那种降级只有用户会发现）。
      # B2B_ROOT 用绝对路径传给 NSIS 的 !cd：NSIS 的相对路径基准是 makensis 的启动
      # 目录而不是脚本目录，靠「反正我 cd 过了」迟早对不上（Git Bash 的 pwd -W 才给
      # Windows 形式的绝对路径，纯 MSYS 形式 /d/... 传给 Windows 版 makensis 会读错）。
      shell: bash
      # 【需求 10B】地板与包名是两条通道之间**唯一**允许不同的东西，所以把它们从命令体
      # 里提到这里：兼容通道那份 yml 只有这四个值不一样，下面的 run 体逐字节相同。
      # 主通道继续用 10.0（=Windows 10），与今天的行为一致（今天就是不传 -D、吃 nsi 默认值）。
      env:
        OUT_FILE: "B2bCollectToolSetup_Win7.exe"
        PORTABLE_NAME: "B2bCollectTool_Win7_portable.zip"
        MIN_WIN_MAJOR: "6"
        MIN_WIN_MINOR: "1"
      run: |
        cd b2bcollect_build
        # 这四个缺任何一个都不许开编。为什么要在运行时就验、不等 makensis 报错：NSIS 的
        # !ifndef 允许命令行 -D 覆盖，**漏传一个 -D 不会编不过**——它会安静地用默认值编出
        # 一个「名字叫 Win7、地板还是 Win10」的包，而那是最坏的形状：用户按文案下载了
        # 「给他的那台老机器准备的那个包」，安装器却把自己的用户拦在门外，而两条流水线全绿。
        for _v in OUT_FILE PORTABLE_NAME MIN_WIN_MAJOR MIN_WIN_MINOR; do
          [ -n "${!_v:-}" ] || { echo "::error::这一步缺 env 变量 ${_v}：地板或包名没钉住，宁可不编安装包"; exit 1; }
        done
        # 地板得是整数：它直接喂给 NSIS 的 IntCmp，带一个非数字字符就是拿一句人话去喂
        # 整数比较（makensis 会回一句用法错误，而日志看着像编译器坏了）。
        case "$MIN_WIN_MAJOR$MIN_WIN_MINOR" in
          ""|*[!0-9]*) echo "::error::地板不是纯数字（major=${MIN_WIN_MAJOR} minor=${MIN_WIN_MINOR}）：它要直接进 NSIS 的整数比较"; exit 1 ;;
        esac
        # makensis 由上一步现下载、校验、解压，并把路径写进 GITHUB_ENV。这里不再
        # 「在机器上找」：找得到找不到都不是产品的事，是镜像的事，而镜像会变（本轮就是
        # 这么红的）。上一步没成功就不该走到这里，走到了也照样停，绝不静默降级成
        # 「只发一个 zip 却告诉用户这就是交付物」。
        [ -n "${MAKENSIS:-}" ] || { echo "::error::上一步没把 makensis 的在包路径传下来（GITHUB_ENV 里的 MAKENSIS 是空的），不许出安装包"; exit 1; }
        [ -f "$MAKENSIS" ] || { echo "::error::makensis 路径不存在：$MAKENSIS"; exit 1; }
        WIN_ROOT=$(pwd -W 2>/dev/null || pwd)
        case "$WIN_ROOT" in
          [A-Za-z]:*) : ;;
          *) echo "::error::拿不到 Windows 形式的绝对路径（当前 ${WIN_ROOT}），NSIS 会读错相对路径"; exit 1 ;;
        esac
        # 权威版本判据就在这一步，不在上一步：上一步是「另外问一句版本号」，这一步是
        # 真正把交付的这个安装包编出来的那一次调用，makensis 自己印的横幅用的就是这台
        # 编译器、这一份字节——不会有「探测一套结果、构建另一套结果」的缝隙。
        # 版本对不上就不出包：宁可没有安装包，也绝不静默降级成「只发一个 zip 却告诉
        # 用户这就是交付物」（那种降级只有用户会发现）。
        [ -n "${NSIS_PINNED:-}" ] || { echo "::error::上一步没把钉住的 NSIS 版本号传下来（GITHUB_ENV 里的 NSIS_PINNED 是空的）：包能编出来，但说不清它和校验过的那份编译器是不是同一个，这种交付物不发"; exit 1; }
        # 版本号必须是四段纯数字（VIProductVersion 只认 X.X.X.X）。2026-11-12 云端就是
        # 栽在这句上：`/DVER4="1.$APP_VERSION.0"` 拼出来是三段，makensis 报
        # 「invalid VIProductVersion format」直接 abort —— 编译器、自检、冒烟全绿，最后
        # 一步没有安装包。这里不再「拼了就算」。
        # 【本轮改这一刀】以前这里把 run_number 拆成两个 16 位字段自己算四段号，那是
        # `tool_version.product_version` 同一件事的第二份实现。需求 2 要的是「一个包的
        # 自己是哪一版只有一个来源」，而两份算法只会在哪天不一致时出问题（而且是
        # 「安装包文件属性上的版本与随包自报的版本不是同一个数」这种谁都说不准的形状）。
        # 现在显示号与四段号都问 tool_version，而它读的就是上面那一步写下去、并且随包
        # 进包的那一份戳：编进 NSIS 的、产物自报的、发布清单里的从此是同一个数。
        # 算不出来（戳没写、构建号不像数、超出四段可表达范围）就当场停：makensis 收下
        # 一个它编不了的号只会回一句 invalid format 就 abort，交付里没有安装包，
        # 而日志看着像编译器坏了。（这句不用 ${VAR:-（空）}：拿非 ASCII 写进参数展开的
        # 默认值里，bash 3.2 的词法扫描会在右花括号前认错，整步连第一行都跑不到。
        # 哪一个字节会带跑解析器没人记得住，所以这一段的语法由「shell 语法硬门」
        # （check_packaging_manifest.py 第 11 条）交给 bash -n 自己判。）
        DISPLAY_VER=$(python tool_version.py --print-field display) || {
          echo "::error::显示版本号没能从随包构建戳里读出来（上面那一步 --write-stamp 没成功，或戳不在 b2bcollect_build/version.json）：宁可不编安装包，也不编一个哪版都不是的号"; exit 1; }
        VER4=$(python tool_version.py --print-field product) || {
          echo "::error::四段版本号（VIProductVersion）没能从随包构建戳里算出来（构建号不像数，或超出每段 16 位的可表达范围）：makensis 收下它只会回一句 invalid format 就 abort"; exit 1; }
        # 形状仍按编译器自己的口径验一遍：上面两句绿不等于 makensis 认这个形状，
        # 而这一步是唯一能把「形状不对」说成「形状不对」的地方。
        DV_SHOW="$DISPLAY_VER"
        [ -n "$DV_SHOW" ] || DV_SHOW="（空）"
        case "$DISPLAY_VER" in
          1.*) : ;;
          *) echo "::error::从构建戳里读到的显示版本号「${DV_SHOW}」不是 1.<build> 那一档（戳与版本算法对不上，先查 tool_version 那一步）"; exit 1 ;;
        esac
        if ! [[ "$VER4" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::tool_version 给出的四段号「${VER4}」不是 makensis 要的 X.X.X.X（它自己拼错了，别等编译器报）"; exit 1
        fi
        echo "· 版本：显示 ${DISPLAY_VER} / 文件属性 ${VER4}（两个都由随包构建戳算出，这一步不再自己拆字段）"
        # 禁掉 Git Bash 的「参数看着像路径就改写」：/DB2B_ROOT=... 这种 NSIS 定义被改写成
        # C:/Program Files/Git/DB2B_ROOT=... 之后编译器只会回一句 Usage；而日志文件名里
        # 带反斜杠时 GNU 工具还会给整行输出加转义前缀（上一节 sha256 就是栽在这上面）。
        export MSYS_NO_PATHCONV=1
        TMP_DIR=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
        LOG="$TMP_DIR/nsis_build.log"
        echo "· 安装包编译器：$MAKENSIS  根目录：$WIN_ROOT  钉住版本：$NSIS_PINNED"
        # -V4：要它把「我是谁」那行横幅和每一步细节都落到日志里。红了好查，绿了也能对版。
        # 管道接 tee 是为了既让日志上屏（Actions 里能直接读）又留一份文件供判据取用。
        # 取码要 PIPESTATUS[0]，理由不是「$? 会漏掉编译器的失败」——本机 bash 3.2.57 实测
        # pipefail 取的是**最右非零**，编译器退 7、tee 成功时 `$?` 同样给 7（Z 节跑真 bash
        # 自证）。真正的理由是**归因**：tee 自己坏（日志落盘路径不合法，Git Bash 的 cygpath
        # 转换就可能坏）时 `$?` 拿到的是 tee 的 1，这句 ::error:: 会指着编译器说「编译失败
        # （退出码 1）」，而编译器其实成功——红了一条谎话。PIPESTATUS[0] 只问首段，谁坏说谁。
        # 写法用 `cmd || rc=${PIPESTATUS[0]}`（实测 bash 3.2 与 5.x 都成立：|| 分支里
        # PIPESTATUS 还是刚那条管道的），不再用 `set +e … set -e` 那种把**整段**保护关掉
        # 的区间——区间里后来人插一条命令，它失败了没人知道，症状与本轮第 15 条一模一样。
        # 但这个写法自己有个前提：管道整体得能反映首段的失败，也就是 pipefail 必须开着——
        # 没开时 tee 成功就压根不进 || 分支，编译器退 3 会被当成成功（它代替不了 pipefail，
        # Z 节跑真 bash 自证）。所以本步**自己声明** pipefail，不赌 runner 的默认 shell
        # 选项：默认值是别人的实现细节，它哪天变了，坏法是「带着编译错误的安装包发出去」，
        # 不是红一条日志。（离线仿真「关掉 pipefail 仍要认得编译器」那一味钉的就是这个。）
        set -o pipefail
        NSIS_RC=0
        # /DMIN_WIN_* 与 /DOUT_FILE 都来自上面的 env：同一份 .nsi 编出两种地板、两个包名。
        # 为什么不在 nsi 里复制一份「兼容版专用脚本」：那会把「缺运行库当场补装」「体检
        # 日志」「旧实例探测」这些踩过坑的逻辑再抄一遍，而抄第二遍的东西一定会漂。
        "$MAKENSIS" -V4 /DB2B_ROOT="$WIN_ROOT" /DAPP_VERSION="$DISPLAY_VER" /DVER4="$VER4" /DMIN_WIN_MAJOR="$MIN_WIN_MAJOR" /DMIN_WIN_MINOR="$MIN_WIN_MINOR" /DOUT_FILE="$OUT_FILE" installer/b2bcollect_setup.nsi 2>&1 | tee "$LOG" || NSIS_RC=${PIPESTATUS[0]}
        if [ "$NSIS_RC" -ne 0 ]; then
          echo "::error::makensis 编译安装包失败（退出码 ${NSIS_RC}，完整日志 ${LOG}）：没有安装包就不交付，绝不静默退化成只发一个 zip"
          exit 1
        fi
        # 上面取了首段，就得给「只有 tee 坏」这一路单独一句话：编译器成功、日志却没写成时，
        # 下一节读横幅只会报「读不到横幅」，把一次落盘故障说成编译器行为异常（正是本轮要根治
        # 的形状——错误的话听起来像别的东西坏了）。留这份文件是判据的输入，输入不在就在这里停。
        if [ ! -s "$LOG" ]; then
          echo "::error::makensis 本身是成功的（首段退出码 0），但编译日志 ${LOG} 没写成或为空：坏的是 tee/落盘这一步（Git Bash 把路径转成 ${RUNNER_TEMP} 时不合法就会这样），不是编译器。后面读横幅全靠这份文件，不放行是为了不让你去查一个没坏的编译器。"
          exit 1
        fi
        # 横幅必须按**真编译器自报的写法**找，不能按想象中的写法找。
        # 2026-11-13 凌晨云端那次红就是这个：这里原来只找 "Nullsoft Install System v…"，
        # 而 NSIS 3.10 的 makensis 自报的是 "MakeNSIS v3.10 - Copyright 1999-2023 Contributors"
        # （run 43271171596 / job 131367773604 编译日志第 924 行的原字节，行尾 \r\n）。
        # 安装包 114MB 已经编出来了，却被这句「读不到横幅」整体拦下——判据猜错格式的代价
        # 就是交付凭空没有安装包，而且它报的话听起来像是编译器坏了。两种写法都收：老 NSIS
        # 与 -V1 走的是 Nullsoft 那句，哪天换编译器不至于再瞎一次。
        # -a 不是可选项：-V4 的日志里混着非 UTF-8 字节（安装包里的中文菜单名是 ANSI 写的），
        # GNU grep 一旦判定「二进制文件」就只回一句 Binary file matches，横幅照样取不到。
        # `|| true` 必须留着：这一步是 bash（GitHub 默认给 -e -o pipefail），编译器一字
        # 不印时 grep 退 1、整条管道就非 0，`set -e` 会在下面那句判据之前把进程带走——
        # 报错的话术永远说不出口，红成「这一步自己炸了」，比猜错横幅格式更难查。
        BANNER=$(grep -haoE "(MakeNSIS|Nullsoft Install System) v[0-9][0-9.]*" "$LOG" 2>/dev/null | head -1 || true)
        if [ -z "$BANNER" ]; then
          echo "::error::编译日志里读不到 makensis 自报版本那行横幅（连 -V4 都没印，这台编译器的行为和预期不一样），无法证明这个安装包出自校验过的那份 NSIS ${NSIS_PINNED}"
          # 把日志开头原样贴出来：下一次编译器换措辞，靠这几行就能当场对格式，不用再去猜。
          echo "::error::横幅判据看到的日志前 5 行（原样，不解释）：$(head -5 "$LOG" 2>/dev/null | tr '\r\n' '  ')"
          exit 1
        fi
        # 版本比对取**全等**而不是通配包含：`*v3.10*` 会放过一个自报 v3.100 的编译器，
        # 那和「自报 v3.1」是两个方向的错，都不该出安装包。
        BANNER_VER=${BANNER##* v}
        if [ "$BANNER_VER" != "$NSIS_PINNED" ]; then
          echo "::error::安装包是自报 ${BANNER} 的 makensis 编出来的，不是钉住的 ${NSIS_PINNED}——两次构建产物不可比，这一份不发"
          exit 1
        fi
        echo "✅ 安装包出自 makensis ${BANNER}（与钉住的 ${NSIS_PINNED}、sha256 已校验的那份一致）"
        # 两个产物名都按本步 env 里钉的那一个找：名字写死在这里的话，兼容通道要么改这一行
        # （两份 yml 从此逐字不同、第 42 条的字节对拍作废），要么要同一个文件叫两个名字。
        ls -l "$OUT_FILE" "$PORTABLE_NAME"

    - name: PE floor gate on the installer (安装包自己的地板)
      # 为什么不和上面那一步一起检：安装包是**这一步才**由 makensis 造出来的。生成器
      # 早期版本把这两条写在了一起（第 14 步去检一个还不存在的文件），那只会得到一句
      # 「文件不在位」——那是顺序错，不是产物错，而且它被 run#2 那 49 项假红盖住了：
      # 不先修假红，这一条还要再藏一轮。
      # NSIS 写的子系统版本比 6.1 还老（这一格脚本对「早于登记表」的形状不误伤，判据在
      # test_frozen_delivery_offline.py 的 DH 节）；真高起来时该问的是编译器参数而不是产物。
      shell: bash
      run: |
        set -u
        cd b2bcollect_build
        python ../.github/scripts/check_pe_floor.py B2bCollectToolSetup_Win7.exe --floor 6.1

    - name: Upload artifacts (Win7 兼容包)
      # 两个产物：安装器（纯小白路径，带运行环境体检与运行库补装）+ 绿色版目录 zip
      # （不让装软件 / 放共享盘的兜底）。名字一律带 _Win7 后缀，与主通道逐字区分——
      # 同名的两个包会在下载侧互相覆盖，而覆盖这件事是静默的。
      # 交付口径：这一版只到 GitHub 制品。固定直链与「一个链接自动选包」是需求 10C，
      # 它要同时改 upload_release_to_oss.ALLOWED_NAMES 与 tool_update.ALLOWED_ARTIFACTS
      # /MANIFEST_BY_KEY 两处登记表，那一刀必须一次切完，不能在这里先漏一条链接。
      uses: actions/upload-artifact@v4
      with:
        name: B2bCollectTool_Win7
        path: |
          b2bcollect_build/B2bCollectToolSetup_Win7.exe
          b2bcollect_build/B2bCollectTool_Win7_portable.zip
        if-no-files-found: error
