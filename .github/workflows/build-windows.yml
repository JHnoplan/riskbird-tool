name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 selenium openpyxl pyinstaller requests websocket-client -i https://pypi.tuna.tsinghua.edu.cn/simple

    - name: Build EXE with PyInstaller
      run: |
        cd riskbird_build
        python -m PyInstaller --noconfirm --onefile --windowed --name RiskBirdTool --collect-all selenium --collect-all PyQt5 --hidden-import requests --hidden-import websocket --hidden-import websocket_client --hidden-import customer_library_cleaner --hidden-import dual_session --hidden-import block_guard --hidden-import crawl_checkpoint --hidden-import yzd_client --hidden-import task_registry riskbird_gui.py

    - name: Copy startup batch file
      run: |
        copy riskbird_build\启动RiskBirdTool.bat riskbird_build\dist\启动RiskBirdTool.bat

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: RiskBirdTool
        path: |
          riskbird_build/dist/RiskBirdTool.exe
          riskbird_build/dist/启动RiskBirdTool.bat

  build-1688:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 selenium openpyxl pyinstaller requests -i https://pypi.tuna.tsinghua.edu.cn/simple

    - name: Build EXE with PyInstaller
      run: |
        cd ali1688_build
        python -m PyInstaller --noconfirm --onefile --windowed --name Ali1688Tool --collect-all selenium --collect-all PyQt5 --hidden-import requests --hidden-import customer_library_cleaner --hidden-import yzd_client --hidden-import task_registry ali1688_gui.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ali1688Tool
        path: |
          ali1688_build/dist/Ali1688Tool.exe
