name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 selenium openpyxl pyinstaller requests websocket-client -i https://pypi.tuna.tsinghua.edu.cn/simple

    - name: Download chromedriver (Stable win64)
      run: |
        $j = Invoke-RestMethod 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'
        $u = ($j.channels.Stable.downloads.chromedriver | Where-Object { $_.platform -eq 'win64' }).url
        Invoke-WebRequest $u -OutFile cd.zip
        Expand-Archive cd.zip -DestinationPath cd_tmp
        Copy-Item cd_tmp/chromedriver-win64/chromedriver.exe riskbird_build/chromedriver.exe
        Write-Host "bundled chromedriver version: $($j.channels.Stable.version)"

    - name: Build EXE with PyInstaller
      run: |
        cd riskbird_build
        python -m PyInstaller --noconfirm --onefile --windowed --name RiskBirdTool --add-data "chromedriver.exe;." --collect-all selenium --collect-all PyQt5 --hidden-import requests --hidden-import websocket --hidden-import websocket_client --hidden-import customer_library_cleaner --hidden-import dual_session --hidden-import block_guard --hidden-import chrome_driver --hidden-import crawl_checkpoint --hidden-import yzd_client --hidden-import task_registry riskbird_gui.py

    - name: Copy startup batch file
      run: |
        copy riskbird_build\启动RiskBirdTool.bat riskbird_build\dist\启动RiskBirdTool.bat

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: RiskBirdTool
        path: |
          riskbird_build/dist/RiskBirdTool.exe
          riskbird_build/dist/启动RiskBirdTool.bat

  build-1688:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 selenium openpyxl pyinstaller requests -i https://pypi.tuna.tsinghua.edu.cn/simple

    - name: Download chromedrivers (Stable + 2 previous majors, win64)
      run: python .github/scripts/fetch_chromedrivers.py

    - name: Build EXE with PyInstaller
      run: |
        cd ali1688_build
        python -m PyInstaller --noconfirm --onefile --windowed --name Ali1688Tool --add-data "drivers;drivers" --collect-all selenium --collect-all PyQt5 --hidden-import requests --hidden-import customer_library_cleaner --hidden-import yzd_client --hidden-import task_registry ali1688_gui.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ali1688Tool
        path: |
          ali1688_build/dist/Ali1688Tool.exe
