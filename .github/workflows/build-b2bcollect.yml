name: Build B2bCollectTool EXE

# 独立 workflow：只有 B2B 多平台工具自身的文件变化才触发打包，
# 与风鸟、1688 两个工具互不牵连（各自独立 workflow，paths 过滤到各自目录）。
#
# 依赖说明（更正历史错误注释）：
#   · 5 个关键词通道（中国制造网/八方资源网/顺企网/爱采购/1688 部分）走「裸 CDP」
#     （requests + websocket-client 直连共享 Chrome 调试端口 9255）；
#   · 但「1688」与「企知道补采」两条通道经由 site_adapters 复用成熟的 Selenium 爬虫
#     （ali1688_build / riskbird_build），因此本工具【确实依赖 selenium + chromedriver】，
#     与 1688 工具一样需内置驱动——旧注释「不依赖 selenium」是错的。
#   · site_adapters 跨目录引用的源文件**数量以 site_adapters.EXTERNAL_MODULES 为准**
#     （由构建前硬门逐项对拍，不在这里抄一份数字），与驱动一并通过 --add-data 打进包；
#     frozen 运行时由 site_adapters 从 sys._MEIPASS 解析这些外部模块树。
#
# 随包凭证（2026-11 外部机器全员丐版的直接根因）：
#   config.json 在 .gitignore 里（密钥绝不入仓库），所以**仓库里永远没有**它；
#   而打包机上也不存在开发机那份 iOS 工程文件。两者叠加的结果是：发出去的每个
#   包都读不到权限服务凭证，外部机器一律被判成精简版。因此这里必须在构建前用
#   Actions Secrets 现写一份 config.json 再 --add-data 进包，并且构建完立刻拿
#   **产物自己**跑一次 --acl-doctor 真连自检；缺 Secret 或自检不通一律构建失败
#   ——宁可发不出包，也不发一个只能丐版的包。
on:
  push:
    branches: [ main ]
    paths:
      - 'b2bcollect_build/**'
      - '.github/workflows/build-b2bcollect.yml'
      - 'enf_clean/**'
      # 与 Mac 版同一句：跨目录引用的采集器源码改了却不重打包，发出去的产物就是旧的。
      # 判据由构建前硬门反查（见 check_packaging_manifest.py 的触发目录检查）。
      - 'ali1688_build/**'
      - 'riskbird_build/**'
  workflow_dispatch:  # 允许在 Actions 页面手动只打包这个工具

jobs:
  build:
    runs-on: windows-latest
    # 同一工具的新提交自动取消仍在排队的旧构建，避免排队干等
    concurrency:
      group: build-b2bcollect-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Packaging manifest gate
      # 构建前硬门：把「产物该有的模块与数据」逐项对拍一遍再开建。
      # 判据在 b2bcollect_build/site_adapters.py 的 EXTERNAL_MODULES（模块的使用者
      # 自己声明运行时要去 _MEIPASS 找哪些 .py），这里把它与下面 PyInstaller 命令行
      # 里的 --add-data/--hidden-import 对拍，另加两条：本地模块新增了却没登记
      # --hidden-import、清单指向的源码已经不存在。
      # 为什么值得单独一步（2026-11-12 实测）：riskbird_crawler_v2.py 与
      # aiqicha_crawler_v2.py 没进包时，构建成功、产物自检也通过（那时自检只验凭证），
      # 用户拿到的包却在「② 公司名单」里只剩企知道一路——**少一个文件不报错、只少
      # 一个平台**，而症状和「档位没给这个功能」长得一模一样，第一轮排查必然被带去
      # 查权限。这类缺陷只能在构建前拦，事后靠用户截图发现要往返几个小时。
      # 纯标准库（ast + 正则），不装任何依赖，所以放在 Install dependencies 之前。
      shell: bash
      run: python .github/scripts/check_packaging_manifest.py

    - name: Write bundled config.json from Secrets
      # 随包凭证注入：值只从 Secrets 经 env 传进进程，绝不 echo、绝不进产物清单之外
      # 的地方（跑完这一步后 config.json 就在 runner 的临时工作区里，随 job 结束销毁）。
      # 缺 OSS 两个 Secret 时**当场失败**：过去正因为这里什么都没有，漏配凭证才会一路
      # 变成一个「能跑但所有人都是精简版」的包发出去。
      shell: bash
      env:
        OSS_AK_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
        OSS_AK_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        python .github/scripts/inject_build_config.py

    - name: Install dependencies
      # 裸 CDP 链路（requests / websocket-client，bs4 用 lxml 解析器）＋
      # 1688/企知道通道所需的 selenium。清单与 b2bcollect_build/*.py 顶层 import 对齐。
      # pillow 不能省：马可波罗「号码图片码」识别引擎 mk_phone_ocr.py 顶层写了
      # `from PIL import Image`，而 parallel_session 是静态 import 这条链路的——缺 PIL
      # 不是马可波罗一个站降级，而是整个 exe 启动即 ModuleNotFoundError。
      # xlrd 不能省：全盘扫描/导入历史数据要读旧版 .xls（本机实测就有一份 2019 展会
      # 名单是 OLE 内容），缺它那份名单会被判「读不了」。它在源码里是函数内 try-import，
      # 依赖分析口径一旦变化就会漏收，所以 pip 与 --hidden-import 两边都显式写上。
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 selenium openpyxl requests websocket-client beautifulsoup4 lxml pillow pyinstaller phonenumbers pandas xlrd -i https://pypi.tuna.tsinghua.edu.cn/simple

    - name: Download chromedrivers (Stable + 2 previous majors, win64)
      # 复用 1688 工具同款脚本：下载最近 3 个大版本的 win64 驱动，按
      # chromedriver.<大版本>.exe 注版放进 ali1688_build/drivers/，运行时按浏览器
      # 实际版本挑配套的驱动（驱动大版本与浏览器不匹配时新版报 cannot connect）。
      run: python .github/scripts/fetch_chromedrivers.py

    - name: Build EXE with PyInstaller
      # hidden-import 覆盖全部本地模块（跨模块新增 import 未被依赖分析收录会导致
      # exe 启动即 ModuleNotFoundError）；pip 名≠import 名的两个名字都写
      # （websocket-client→websocket / websocket_client；beautifulsoup4→bs4；pillow→PIL）。
      # gys_crawler/solarbe_crawler 已下线，不再打包。keyword_expander 为「智能解析」知识库模块。
      # 权限三件套必须一起写：access_guard（门禁+名单+设备绑定）、edition（能力矩阵，
      # 界面每个入口都问它）、acl_admin_dialog（等级 0 的「权限管理」面板）。最后这个是
      # 函数内延迟 import，界面对它做了「加载失败只提示不崩」的降级——漏收不会启动即崩，
      # 而是管理员点开面板才发现少模块，这种失败最晚暴露、最难查，所以绝不靠运气。
      # 维护约定：每次给 b2bcollect_build/*.py 新增 import 或新增本地模块，必须把
      #   grep -hoE "^(import|from) [a-zA-Z_]+" *.py
      # 与下面两个清单逐行对一次，而不是凭记忆维护（新增采集站 gi_crawler /
      # makepolo_crawler / maimaib2b_crawler / province_filter / mk_phone_ocr 一度就这么漏过）。
      # mk_phone_font.json 是马可波罗图片码的字形字典（运行时零标注成本的全部本钱），
      # 不 --add-data 进包则打包版手机号识别永远拿不到字典。
      # 必须显式 shell: bash：Windows runner 上 run 步的**默认** shell 是 pwsh，
      # 上面那句 `[ -f config.json ] || { ...; exit 1; }` 在 PowerShell 里会被当成
      # 类型表达式解析，当场 ParserError「Missing type name after '['」——构建连
      # PyInstaller 都没启动就红了（实机踩过）。声明成 bash 之后这一步与 Mac 版
      # 同一份脚本，两个平台的差异只剩 --add-data 的分隔符和驱动文件名。
      #
      # 【本轮根修：去掉 --onefile，改出 onedir 目录】（2026-11-12 Windows 实机崩溃）
      #   现场：打开工具正常，切换账号后点界面上的「重启」就报
      #     FileNotFoundError: ...\Temp\_MEI000025982\base_library.zip
      #   onefile 每次启动都把整个运行时解包到一个 %TEMP%\_MEI<pid> 目录，**退出时删掉**。
      #   于是「重启自己」天生要和这个回收过程赛跑：旧实例还没删完、新实例已经在同一个
      #   临时目录上开始解包（PID 复用时会撞名），解到一半的归档被对方删掉，PyInstaller
      #   的 zipimport 就在那句「读 base_library.zip」上抛 ENOENT——栈里全是
      #   importlib/_bootstrap 与 zipimport，用户看到的却是一句和账号、和风鸟都无关的
      #   「找不到文件」，排查方向极容易被带去查网络或权限。
      #   第二重代价更隐蔽：onefile 的 ``__file__`` 指向那个退出即删的目录，**所有**按
      #   「模块所在目录」写的缓存、Cookie、字体字典都会每次归零（本项目里是风鸟/爱企查
      #   的 Cookie 与 30 天列表缓存），症状不是报错，是「每天白烧一遍查询额度」。
      #   onedir 把这两件事一起消掉：运行时就是安装目录里的真实文件，不解包、不回收、
      #   没有赛跑，``sys.executable`` 与数据落点都稳定。这也与 Mac 侧本来就用的 onedir
      #   对齐——两个平台一种交付形态，打包脚本与校验器也少一套分支。
      #   代价是产物从「一个 exe」变成「一个目录」，所以必须配安装包（下一步 NSIS），
      #   并且额外留一份目录 zip 作为「不想装东西」的兜底。
      shell: bash
      run: |
        cd b2bcollect_build
        # 随包配置必须真的存在才许开建：少了它，产物就是个「外部机器一律精简版」的包
        [ -f config.json ] || { echo "::error::b2bcollect_build/config.json 不存在（上一步注入没成功），不许出包"; exit 1; }
        python -m PyInstaller --noconfirm --clean --windowed --name B2bCollectTool --collect-all selenium --collect-all PyQt5 --collect-all lxml --collect-all bs4 --collect-submodules PIL --hidden-import requests --hidden-import websocket --hidden-import websocket_client --hidden-import openpyxl --hidden-import cdp_base --hidden-import shared_chrome --hidden-import parallel_session --hidden-import mic_crawler --hidden-import b2b168_crawler --hidden-import qihuo11467_crawler --hidden-import aipage_crawler --hidden-import maimaib2b_crawler --hidden-import gi_crawler --hidden-import makepolo_crawler --hidden-import mk_phone_ocr --hidden-import province_filter --hidden-import site_adapters --hidden-import pending_companies --hidden-import keyword_expander --hidden-import deepseek_expander --hidden-import gongchang_crawler --hidden-import customer_library_cleaner --hidden-import enhanced_cleaner --hidden-import enf_clean.normalize --hidden-import enf_clean.phone --hidden-import phonenumbers --hidden-import pandas --hidden-import xlrd --hidden-import local_scan --hidden-import yzd_client --hidden-import task_registry --hidden-import oss_pool_client --hidden-import data_pool --hidden-import pool_matcher --hidden-import pool_dialogs --hidden-import access_guard --hidden-import edition --hidden-import acl_admin_dialog --hidden-import feedback_store --hidden-import search_suggest --hidden-import recommend_engine --hidden-import dedup_engine --hidden-import mapping_recommender --hidden-import audit_logger --hidden-import search_optimizer --hidden-import pool_merge --hidden-import ingest_cleaning --hidden-import pool_store --hidden-import tool_config --add-data "config.json;." --add-data "mk_phone_font.json;." --add-data "..\enf_clean;enf_clean" --add-data "..\ali1688_build\ali1688_crawler.py;ali1688_build" --add-data "..\riskbird_build\qizhidao_crawler.py;riskbird_build" --add-data "..\riskbird_build\block_guard.py;riskbird_build" --add-data "..\riskbird_build\chrome_driver.py;riskbird_build" --add-data "..\riskbird_build\riskbird_crawler_v2.py;riskbird_build" --add-data "..\riskbird_build\aiqicha_crawler_v2.py;riskbird_build" --add-data "..\riskbird_build\runtime_paths.py;riskbird_build" --add-data "..\ali1688_build\drivers;drivers" b2bcollect_gui.py

    - name: Artifact doctor gate (B2bCollectTool.exe --acl-doctor)
      # 发包门禁：**用产物自己**验证「这个 exe 能不能连上权限服务」。放在上传之前，
      # 不通就不许有制品可下。必须走 --windowed 的 exe，所以用 Start-Process -Wait
      # 拿退出码（GUI 子系统程序在 shell 里不会被自然等待，这是 Windows 上的老坑）；
      # 报告同时落在包外状态目录 acl_doctor.txt，失败时把原文打出来供远程排障。
      # 必须带超时：这一步最坏的失败形态不是非零退出，而是**一声不响地卡住**
      # （参数没被认出来就会走到建界面那条路，runner 上多半也没有可用图形会话），
      # 一卡就是 job 默认的 6 小时，日志里连一行自检结论都留不下。exe 里的自检
      # 本身是有界的（网络侧全部带超时与重试上限），这里再兜一层防「没走到那里」。
      # onedir 之后 exe 住在 dist\B2bCollectTool\ 里，自检报告也落在它同级的
      # b2bcollect_state 下；这里用递归查找而不是写死路径，将来布局再变（比如
      # _internal 挪位置）也不会出现「产物是好的、门禁读错了文件」这种假失败。
      timeout-minutes: 10
      shell: pwsh
      run: |
        $exe = "b2bcollect_build\dist\B2bCollectTool\B2bCollectTool.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "::error::产物没生成到位：${exe}（onedir 布局变了？先修这一步再谈交付）"
          exit 1
        }
        $p = Start-Process -FilePath $exe -ArgumentList "--acl-doctor" -Wait -PassThru
        $log = Get-ChildItem -Path "b2bcollect_build\dist" -Recurse -Filter "acl_doctor.txt" |
               Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($log) { Get-Content $log.FullName } else { Write-Host "（没找到 acl_doctor.txt）" }
        Write-Host "acl-doctor exit code = $($p.ExitCode)"
        if ($p.ExitCode -ne 0) {
          Write-Host "::error::产物自检未通过（退出码 $($p.ExitCode)）：这个包发出去只会是精简版，禁止上传"
          exit $p.ExitCode
        }

    - name: Window smoke gate (B2bCollectTool.exe --ui-smoke)
      # 与 Mac 那一步同一条判据、同一个入口：让**产物自己**把界面真建一遍，退出码 0 才
      # 许装配交付。（2026-11-12 那份 Windows 崩溃栈停在 ``File "b2bcollect_gui.py",
      # line 39, in <module>``——正好是「建窗口之前的 import」那一段，而 --acl-doctor
      # 刻意不碰 Qt：它验凭证、验通道、验落点，唯独不建窗口。于是「双击开不出界面」这一
      # 整类故障在当天的门禁里是全绿的，只有用户能发现。这一步把那段盲区补成发包判据。）
      # 这里不再模拟只读卷：Windows 本轮的根因是 onefile 的 _MEI 回收赛跑，改 onedir 之后
      # 那个目录压根不存在了；「安装目录写不进去」（装在 Program Files、放共享盘、U 盘）
      # 由 tool_config 与 riskbird_build/runtime_paths 的候选链兜住，那条口径由离线回归
      # 与 --acl-doctor 的落点纪律（退出码 9）两头钉住，不靠这一仿真的运气。
      # QT_QPA_PLATFORM 显式给 offscreen：runner 上有没有交互式桌面不是产品的事，赌它输了
      # 就分不清「包坏了」还是「这台机器没会话」；随包的平台插件收没收到也由这一步的答案
      # 说话——缺 qoffscreen.dll 会红在这里，而不是红在用户的双击上。
      # USERPROFILE 指进临时目录有两个作用：门禁不碰 runner 的真实配置，并且「界面开成了
      # 却留下一份崩溃日志」这种异常被吞掉的半坏状态也能被查出来（只看退出码会放过它）。
      # 排在装配之前是刻意的：这一步会在安装目录里跑出 b2bcollect_state 等运行期目录，正好
      # 由下一步（package_win_artifacts.py）统一剔掉——交付物里绝不带 CI 那台机器的状态。
      timeout-minutes: 10
      shell: pwsh
      run: |
        $exe = "b2bcollect_build\dist\B2bCollectTool\B2bCollectTool.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "::error::产物没生成到位：${exe}（onedir 布局变了？先修构建那一步再谈交付）"
          exit 1
        }
        $stage = Join-Path $env:RUNNER_TEMP "ui-smoke-home"
        if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        $env:QT_QPA_PLATFORM = "offscreen"
        $env:USERPROFILE = $stage
        $env:HOME = $stage
        $p = Start-Process -FilePath $exe -ArgumentList "--ui-smoke" -Wait -PassThru
        Write-Host "ui-smoke exit code = $($p.ExitCode)"
        $stray = @(Get-ChildItem -Path $stage -Recurse -Filter "*.log" -ErrorAction SilentlyContinue)
        foreach ($f in $stray) {
          Write-Host "—— 崩溃日志 $($f.FullName) ——"
          Get-Content $f.FullName
        }
        if ($p.ExitCode -ne 0) {
          Write-Host "::error::窗口没建出来（退出码 $($p.ExitCode)）：用户双击打开就是这个样子，禁止装配交付"
          exit $p.ExitCode
        }
        if ($stray.Count -gt 0) {
          Write-Host "::error::窗口建成了却留下崩溃日志：启动路径上有异常被吞掉了，两者不能同时成立"
          exit 1
        }
        Write-Host "✅ 窗口冒烟通过：界面建得出、崩溃日志一份都没有"

    - name: Package Windows artifacts
      # onedir 交付装配，三道事一并做（判据全在脚本里，不抄在 yml）：
      #   1) 验布局：dist\B2bCollectTool\ 里 exe + _internal + 随包凭证 + 跨目录采集器
      #      一项不缺，并且**dist 里不许再躺一个旧的单文件 exe**（那个会把本轮修好的
      #      onefile 故障原样带回用户机器）；
      #   2) 剔运行期目录：上一步 --acl-doctor 在 runner 上跑出了 b2bcollect_state 等
      #      目录，那是「CI 那台机器」的状态，绝不能进任何交付物；
      #   3) 打绿色版 zip：顶层固定是一个 B2bCollectTool/ 目录 + 一份使用说明，
      #      给「不让装软件 / 放共享盘」的场景兜底。
      # 这一步排在安装包之前：makensis 用 File /r 拷整棵 dist 树，先剔干净再拷，
      # 安装器与 zip 才是同一份干净布局。
      shell: bash
      run: python .github/scripts/package_win_artifacts.py --root b2bcollect_build

    - name: Provision NSIS (钉版本 + 校验 sha256)
      # 第五刀（2026-11-12 Windows 实机）：原来这一步是「在 runner 上找 makensis，
      # 找不到就报错」，红在**所有**产物步骤之后——exe 打好了、--acl-doctor 过了、
      # 绿色 zip 也生成了，只差最后这一步，用户手里还是没有安装包。根因不是脚本写错，
      # 是「工具链依赖这台机器恰好装了什么」：镜像一更新 NSIS 就没了，本机永远复现不了。
      # 业界对这件事的标准答案是 hermetic 构建：自己下载、钉死版本、校验 sha256、解压即用。
      # 镜像里就算有 makensis 也不借用——两次构建用同一个编译器，产物才可比。
      # 下载/校验/解压每一步失败都在这里响，不留给 NSIS 一句谁也看不懂的「文件不存在」。
      shell: bash
      env:
        NSIS_VERSION: "3.10"
        NSIS_SHA256: "fcdce3229717a2a148e7cda0ab5bdb667f39d8fb33ede1da8dabc336bd5ad110"
      run: |
        set -u
        MAJOR=${NSIS_VERSION%%.*}
        DEST="$GITHUB_WORKSPACE/.tools/nsis-$NSIS_VERSION"
        MK="$DEST/Bin/makensis.exe"
        ZIP="$RUNNER_TEMP/nsis-$NSIS_VERSION.zip"
        # 两条官方写法（downloads.sourceforge.net 与 /files 页面那条），都走 HTTPS、
        # 都会被重定向到镜像；一个不通换另一个再试，最后仍用 sha256 收口——
        # 镜像可以换，字节不能换。
        URLS="https://downloads.sourceforge.net/project/nsis/NSIS%20$MAJOR/$NSIS_VERSION/nsis-$NSIS_VERSION.zip
        https://sourceforge.net/projects/nsis/files/NSIS%20$MAJOR/$NSIS_VERSION/nsis-$NSIS_VERSION.zip/download"
        sha256() {
          # 格式依据：这里取的不是「sha256sum/certutil 各自行文里的第几列」，而是 SHA-256
          # 摘要的**定义**——十六进制表示恒为 64 个 hex 字符。所以两条分支同一条规矩：整段
          # 输出里扫 64 位 hex，谁的话术变了都取不到值（取不到就是空串，下面按不等处理）。
          # 反面写法是 `| awk '{print $1}'` 或 `sed -n 2p`：certutil 除了哈希还会印一句
          # 「CertUtil: -hashfile command completed successfully.」，按行号/字段切就有机会
          # 切到那句话上，而本机没有 certutil，这种红只能在云端第一次出现。
          # 只从**内容**算哈希，别让文件名参与输出。这不是洁癖：Git Bash 里 $RUNNER_TEMP
          # 是 `D:\a\...\_temp` 这种带反斜杠的 Windows 路径，而 GNU coreutils 的规定是
          # 「文件名里含反斜杠或换行时，整行输出前面加一个 \\ 作为转义标记」，于是
          # `sha256sum … | awk '{print $1}'` 拿到的是 `\fcdce…`——哈希本身完全正确，却和
          # 钉住的值「对不上」，2026-11-12 那次 CI 就是这么红的。用 < 喂标准输入，输出里
          # 压根没有文件名可转义；再只取 64 位十六进制兜一层，两条分支同规矩。
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum < "$1" | grep -oE "[0-9a-fA-F]{64}" | head -1 || true
          else
            certutil -hashfile "$(cygpath -w "$1")" SHA256 | grep -oE "[0-9a-fA-F]{64}" | head -1 || true
          fi
        }
        if [ ! -f "$MK" ]; then
          got=""
          for round in 1 2 3; do
            for u in $URLS; do
              rm -f "$ZIP"
              curl -sSLf --connect-timeout 20 --max-time 180 -o "$ZIP" "$u" \
                || { echo "· 下载失败（镜像抖动，换下一条）：$u"; continue; }
              got=$(sha256 "$ZIP")
              [ "$got" = "$NSIS_SHA256" ] && break 2
              echo "· 第 $round 轮校验不过（下坏了或没下全）：$got"
            done
          done
          [ "$got" = "$NSIS_SHA256" ] || {
            echo "::error::nsis-$NSIS_VERSION.zip 的 sha256 与钉住的值不一致（或三轮都没下全）：期望 $NSIS_SHA256 实际 ${got:-无}。宁可不打安装包，也不拿一个来路不明的编译器打用户手上的东西"
            exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          # Git Bash 自带 unzip，走不到下面这条；但兜底分支必须是**能跑的**：PowerShell
          # 不认 /d/... 这种 MSYS 路径，直接把 $ZIP 传给它只会得到一句「路径不存在」，
          # 而这一步的失败原因看起来会像「NSIS 包坏了」。（同一句里两处都要 cygpath -w，
          # 别只给 DestinationPath 加——本轮就是这么漏的。）
          if command -v unzip >/dev/null 2>&1; then unzip -q -o "$ZIP" -d "$GITHUB_WORKSPACE/.tools"
          else powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$ZIP")' -DestinationPath '$(cygpath -w "$GITHUB_WORKSPACE/.tools")' -Force" >/dev/null; fi
        fi
        [ -f "$MK" ] || { echo "::error::解压后没找到 ${MK}（NSIS 目录布局变了？别改这一步，改钉住的版本并重新校验）"; exit 1; }
        # 不用 `| head -1`：这个 job 开着 pipefail，head 提前收线会让上游吃一个 SIGPIPE，
        # 于是「版本打印成功」也能变成「这一步失败」——这种红法谁也想不到是管道干的。
        # 写法也不许赌一种：makensis 的选项前缀 / 与 - 都算，可 Git Bash 会把以 / 开头的
        # 参数当**路径**转换（/VERSION → C:/Program Files/Git/VERSION），于是编译器收到的
        # 是个不存在的文件名，回一句 Usage。2026-11-12 云端就是这么红的：sha256 校验早就
        # 过了，红在「版本探测」这一步——探测失败与编译器坏了看起来一模一样。
        # 所以：①几种写法逐个试（统一 MSYS_NO_PATHCONV=1，别LET bash 改写参数）；②探到
        # 版本号就按钉住的值硬对，探不到**不在这里判死**——真正说了算的是下一步编译时
        # makensis 自己印的那行横幅，它用的就是交付这个安装包的那台编译器，不会有「探测
        # 与构建两套结果」的缝隙。
        VOUT=""
        VATTEMPTS=""
        for opt in -VERSION //VERSION /VERSION; do
          out=$(MSYS_NO_PATHCONV=1 "$MK" "$opt" 2>&1 || true)
          first=${out%%$'\n'*}
          VATTEMPTS="${VATTEMPTS}${opt} => ${first}"$'\n'
          case "$first" in
            *v[0-9]*) VOUT="$first"; break ;;
          esac
        done
        if [ -n "$VOUT" ]; then
          case "$VOUT" in
            *v"$NSIS_VERSION"*) echo "· 安装包编译器：${MK}（${VOUT}，sha256 已校验）" ;;
            *) echo "::error::makensis 自报的版本不是钉住的 ${NSIS_VERSION}（实际 ${VOUT}）"
               echo "试过的写法与返回："; printf '%s' "$VATTEMPTS"
               exit 1 ;;
          esac
        else
          echo "· 版本开关这几种写法都没理人，改由安装包那一步用编译器自己的横幅定版（不是放行，是换一处更硬的判据）"
          printf '%s' "$VATTEMPTS"
        fi
        echo "MAKENSIS=$MK" >> "$GITHUB_ENV"
        echo "NSIS_PINNED=$NSIS_VERSION" >> "$GITHUB_ENV"

    - name: Build Windows installer (NSIS, per-user)
      # 交付形态：目录形态的产物必须靠安装包落到用户机器上，否则「解压到哪都行」会
      # 变成「用户把文件夹删了一半」。这里按业界主流做法做成**每用户安装**：
      #   · 默认目录 $LOCALAPPDATA\Programs\B2bCollectTool —— 用户在配置文件里，
      #     RequestExecutionLevel user 不弹 UAC（VS Code / Slack / Discord 同一路线），
      #     也保证安装目录本身**可写**：Cookie、缓存、自检报告这些运行期数据按
      #     riskbird_build/runtime_paths.py 与 tool_config.state_dir 的口径优先落在
      #     程序同级，装在 Program Files 里就会全部退到用户目录，用户看不见也
      #     说不清「为什么我的登录状态没保住」。
      #   · 卸载信息写 HKCU（不是 HKLM），控制面板里能正常卸载、且不污染机器级注册表。
      # makensis 不在位就直接失败：宁可没有安装包，也绝不静默退化成「只发一个 zip」
      # 却告诉用户「这就是交付物」（那种降级只有用户会发现）。
      # B2B_ROOT 用绝对路径传给 NSIS 的 !cd：NSIS 的相对路径基准是 makensis 的启动
      # 目录而不是脚本目录，靠「反正我 cd 过了」迟早对不上（Git Bash 的 pwd -W 才给
      # Windows 形式的绝对路径，纯 MSYS 形式 /d/... 传给 Windows 版 makensis 会读错）。
      shell: bash
      env:
        APP_VERSION: ${{ github.run_number }}
      run: |
        cd b2bcollect_build
        # makensis 由上一步现下载、校验、解压，并把路径写进 GITHUB_ENV。这里不再
        # 「在机器上找」：找得到找不到都不是产品的事，是镜像的事，而镜像会变（本轮就是
        # 这么红的）。上一步没成功就不该走到这里，走到了也照样停，绝不静默降级成
        # 「只发一个 zip 却告诉用户这就是交付物」。
        [ -n "${MAKENSIS:-}" ] || { echo "::error::上一步没把 makensis 的在包路径传下来（GITHUB_ENV 里的 MAKENSIS 是空的），不许出安装包"; exit 1; }
        [ -f "$MAKENSIS" ] || { echo "::error::makensis 路径不存在：$MAKENSIS"; exit 1; }
        WIN_ROOT=$(pwd -W 2>/dev/null || pwd)
        case "$WIN_ROOT" in
          [A-Za-z]:*) : ;;
          *) echo "::error::拿不到 Windows 形式的绝对路径（当前 ${WIN_ROOT}），NSIS 会读错相对路径"; exit 1 ;;
        esac
        # 权威版本判据就在这一步，不在上一步：上一步是「另外问一句版本号」，这一步是
        # 真正把交付的这个安装包编出来的那一次调用，makensis 自己印的横幅用的就是这台
        # 编译器、这一份字节——不会有「探测一套结果、构建另一套结果」的缝隙。
        # 版本对不上就不出包：宁可没有安装包，也绝不静默降级成「只发一个 zip 却告诉
        # 用户这就是交付物」（那种降级只有用户会发现）。
        [ -n "${NSIS_PINNED:-}" ] || { echo "::error::上一步没把钉住的 NSIS 版本号传下来（GITHUB_ENV 里的 NSIS_PINNED 是空的）：包能编出来，但说不清它和校验过的那份编译器是不是同一个，这种交付物不发"; exit 1; }
        # 版本号必须是四段纯数字（VIProductVersion 只认 X.X.X.X）。2026-11-12 云端就是
        # 栽在这句上：`/DVER4="1.$APP_VERSION.0"` 拼出来是三段，makensis 报
        # 「invalid VIProductVersion format」直接 abort —— 编译器、自检、冒烟全绿，最后
        # 一步没有安装包。这里不再「拼了就算」：先把 run_number 拆成两个 16 位字段
        # （版本号要能唯一且单调递增，直接放进一段迟早超过 65535 被编译器拒掉），
        # 再按编译器自己的口径验一遍格式，验不过就不开建。
        # 注意这句为什么不用 ${APP_VERSION:-（空）}：把非 ASCII 写进参数展开的默认值里，
        # bash 3.2 的词法扫描会在右花括号前认错（报 unexpected EOF looking for matching `"'），
        # 整步连第一行都跑不到。哪一个字节会带跑解析器没人记得住，所以这一段现在由
        # 「shell 语法硬门」（check_packaging_manifest.py 第 11 条）交给 bash -n 自己判。
        AV_SHOW="$APP_VERSION"
        [ -n "$AV_SHOW" ] || AV_SHOW="（空）"
        case "${APP_VERSION:-}" in
          ''|*[!0-9]*) echo "::error::APP_VERSION 必须是纯数字（它要参与拼 VIProductVersion 的四段版本号），实际拿到「${AV_SHOW}」；拼错的版本号 makensis 只回一句 invalid format 就 abort，交付里根本没有安装包"; exit 1 ;;
        esac
        VER4="1.$((APP_VERSION / 65536)).$((APP_VERSION % 65536)).0"
        if [ "$APP_VERSION" -ge 4294967296 ]; then
          echo "::error::run_number 已经到 ${APP_VERSION}，四段版本号（每段 16 位）装不下了：这一步不能悄悄放过，否则 makensis 收下一个它编不了的版本号，交付里根本没有安装包"
          exit 1
        fi
        if ! [[ "$VER4" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::拼出来的版本号「${VER4}」不是 makensis 要的 X.X.X.X（这一步自己算错了，别等编译器报）"; exit 1
        fi
        echo "· 版本：显示 1.${APP_VERSION} / 文件属性 ${VER4}（四段，每段都在 16 位范围内）"
        # 禁掉 Git Bash 的「参数看着像路径就改写」：/DB2B_ROOT=... 这种 NSIS 定义被改写成
        # C:/Program Files/Git/DB2B_ROOT=... 之后编译器只会回一句 Usage；而日志文件名里
        # 带反斜杠时 GNU 工具还会给整行输出加转义前缀（上一节 sha256 就是栽在这上面）。
        export MSYS_NO_PATHCONV=1
        TMP_DIR=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
        LOG="$TMP_DIR/nsis_build.log"
        echo "· 安装包编译器：$MAKENSIS  根目录：$WIN_ROOT  钉住版本：$NSIS_PINNED"
        # -V4：要它把「我是谁」那行横幅和每一步细节都落到日志里。红了好查，绿了也能对版。
        # 管道接 tee 是为了既让日志上屏（Actions 里能直接读）又留一份文件供判据取用；
        # 但 pipefail 会把「tee 成功」和「编译器失败」搅在一起，所以显式取 PIPESTATUS[0]，
        # 并在这个区间里关掉 -e——否则编译器一非零，下面那行判据压根执行不到。
        set +e
        "$MAKENSIS" -V4 /DB2B_ROOT="$WIN_ROOT" /DAPP_VERSION="1.$APP_VERSION" /DVER4="$VER4" installer/b2bcollect_setup.nsi 2>&1 | tee "$LOG"
        NSIS_RC=${PIPESTATUS[0]}
        set -e
        if [ "$NSIS_RC" -ne 0 ]; then
          echo "::error::makensis 编译安装包失败（退出码 ${NSIS_RC}，完整日志 ${LOG}）：没有安装包就不交付，绝不静默退化成只发一个 zip"
          exit 1
        fi
        # 横幅必须按**真编译器自报的写法**找，不能按想象中的写法找。
        # 2026-11-13 凌晨云端那次红就是这个：这里原来只找 "Nullsoft Install System v…"，
        # 而 NSIS 3.10 的 makensis 自报的是 "MakeNSIS v3.10 - Copyright 1999-2023 Contributors"
        # （run 43271171596 / job 131367773604 编译日志第 924 行的原字节，行尾 \r\n）。
        # 安装包 114MB 已经编出来了，却被这句「读不到横幅」整体拦下——判据猜错格式的代价
        # 就是交付凭空没有安装包，而且它报的话听起来像是编译器坏了。两种写法都收：老 NSIS
        # 与 -V1 走的是 Nullsoft 那句，哪天换编译器不至于再瞎一次。
        # -a 不是可选项：-V4 的日志里混着非 UTF-8 字节（安装包里的中文菜单名是 ANSI 写的），
        # GNU grep 一旦判定「二进制文件」就只回一句 Binary file matches，横幅照样取不到。
        # `|| true` 必须留着：这一步是 bash（GitHub 默认给 -e -o pipefail），编译器一字
        # 不印时 grep 退 1、整条管道就非 0，`set -e` 会在下面那句判据之前把进程带走——
        # 报错的话术永远说不出口，红成「这一步自己炸了」，比猜错横幅格式更难查。
        BANNER=$(grep -haoE "(MakeNSIS|Nullsoft Install System) v[0-9][0-9.]*" "$LOG" 2>/dev/null | head -1 || true)
        if [ -z "$BANNER" ]; then
          echo "::error::编译日志里读不到 makensis 自报版本那行横幅（连 -V4 都没印，这台编译器的行为和预期不一样），无法证明这个安装包出自校验过的那份 NSIS ${NSIS_PINNED}"
          # 把日志开头原样贴出来：下一次编译器换措辞，靠这几行就能当场对格式，不用再去猜。
          echo "::error::横幅判据看到的日志前 5 行（原样，不解释）：$(head -5 "$LOG" 2>/dev/null | tr '\r\n' '  ')"
          exit 1
        fi
        # 版本比对取**全等**而不是通配包含：`*v3.10*` 会放过一个自报 v3.100 的编译器，
        # 那和「自报 v3.1」是两个方向的错，都不该出安装包。
        BANNER_VER=${BANNER##* v}
        if [ "$BANNER_VER" != "$NSIS_PINNED" ]; then
          echo "::error::安装包是自报 ${BANNER} 的 makensis 编出来的，不是钉住的 ${NSIS_PINNED}——两次构建产物不可比，这一份不发"
          exit 1
        fi
        echo "✅ 安装包出自 makensis ${BANNER}（与钉住的 ${NSIS_PINNED}、sha256 已校验的那份一致）"
        ls -l B2bCollectToolSetup.exe B2bCollectTool_Win_portable.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: B2bCollectTool
        path: |
          b2bcollect_build/B2bCollectToolSetup.exe
          b2bcollect_build/B2bCollectTool_Win_portable.zip
        if-no-files-found: error
